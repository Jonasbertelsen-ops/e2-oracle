<!DOCTYPE html>
<html lang="en">
<head>

<title>E2 Model</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">

<style>
:root{
  --base:#040C10; --bg:#06181F; --card:rgba(7,9,12,0.88); --surface:#0B2129;
  --tint:rgba(42,138,143,0.10); --text:#EAF4F8; --muted:#9FBAC6; --faint:#5F7A86;
  --border:rgba(77,184,217,0.16); --border-strong:rgba(77,184,217,0.38);
  --accent:#4DB8D9; --teal:#2A8A8F; --red:#D92E3A; --steel:#5D7488;
  --violet:#5B4FA8; --yellow:#F0C040;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --num:'Oswald',var(--mono);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  --hshadow:0 3px 9px rgba(2,3,5,0.98),0 0 30px rgba(2,3,5,0.95),0 0 60px rgba(2,3,5,0.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--base);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.4}
body{padding-top:env(safe-area-inset-top,0px);min-height:100%}
#fog{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 55% at 82% 8%, rgba(14,74,92,0.95) 0, rgba(14,74,92,0.55) 35%, rgba(6,24,31,0) 70%),
  radial-gradient(70% 70% at 95% 45%, rgba(42,138,143,0.28) 0, rgba(6,24,31,0) 65%),
  radial-gradient(90% 80% at 10% 95%, #020608 0, rgba(2,6,8,0.6) 45%, rgba(6,24,31,0) 75%),
  linear-gradient(200deg, #0E4A5C 0, #083040 35%, #06181F 60%, #030A0E 100%)}
#fog::after{content:"";position:absolute;inset:-20%;opacity:.55;background:
  radial-gradient(45% 45% at 30% 20%, rgba(42,138,143,0.22) 0, rgba(6,24,31,0) 70%),
  radial-gradient(40% 40% at 70% 80%, rgba(14,74,92,0.30) 0, rgba(6,24,31,0) 70%);
  animation:drift 48s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1.05)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){#fog::after{animation:none}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:14px 16px 10px;
  background:linear-gradient(180deg,rgba(4,12,16,0.92),rgba(4,12,16,0.0));backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;
  background:rgba(4,12,16,0.92);backdrop-filter:blur(8px)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.3em;text-transform:uppercase;margin:2px 0 0;text-shadow:var(--hshadow)}
main{padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
.view{display:none;animation:fade .2s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
.card h2{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h3{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;margin:16px 0 6px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--num);font-weight:600;font-size:30px;color:var(--accent);text-shadow:0 0 18px rgba(77,184,217,0.45);line-height:1}
.unit{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.1em}
.state{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.sub{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.divider{height:1px;background:var(--border);margin:12px 0}

.i{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;
  border:1px solid var(--border-strong);color:var(--accent);font-family:var(--mono);font-size:11px;
  background:transparent;cursor:pointer;flex:0 0 auto}
.alert{border-color:var(--yellow);
  background:linear-gradient(180deg,rgba(240,192,64,0.10),rgba(240,192,64,0.02)),rgba(7,9,12,0.88)}
.alert h2{color:var(--yellow)}
.alert .state{color:var(--yellow)}
.notice{border-left:3px solid var(--border-strong);padding:6px 0 6px 12px;margin:10px 0;color:var(--muted);font-size:14px}
.notice.warn{border-left-color:var(--yellow)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.n{font-family:var(--num);color:var(--text)}
tr.conflict td{color:var(--yellow)}

button.act{min-height:52px;width:100%;border-radius:12px;border:1px solid var(--border-strong);
  background:transparent;color:var(--text);font-family:var(--mono);font-weight:700;font-size:13px;
  letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0 14px}
button.primary{background:var(--accent);color:#07090C;border-color:var(--accent);box-shadow:0 0 24px rgba(77,184,217,0.35)}
button.sm{min-height:44px;font-size:12px;letter-spacing:.14em}
input,select{width:100%;min-height:52px;background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:12px;padding:0 14px;font-family:var(--body);font-size:16px}
textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;font-family:var(--body);font-size:16px;min-height:72px;resize:vertical}
label.fl{display:block;margin:12px 0 4px}
.field-lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{flex:1 1 30%;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:0 8px}
.chip.sel{border-color:var(--accent);color:var(--accent);background:var(--tint);box-shadow:0 0 16px rgba(77,184,217,0.25)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(4,12,16,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border)}
nav button{flex:1;background:transparent;border:0;border-top:2px solid transparent;color:var(--faint);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:12px 2px 14px;cursor:pointer}
nav button.on{color:var(--accent);border-top-color:var(--accent);text-shadow:0 0 14px rgba(77,184,217,0.55)}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(2,6,8,0.7);display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:620px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border-strong);
  border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet h4{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.sheet p{margin:8px 0;font-size:15px;color:var(--text)}
.sheet .k{color:var(--muted);font-family:var(--mono);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:999px;padding:10px 18px;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--border);border-radius:999px;padding:2px 8px;display:inline-block}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.menu-btn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;margin:8px 0;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 16px;color:var(--text);
  font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.menu-btn span{color:var(--faint)}
</style>
</head>
<body>
<div id="fog"></div>
<header>
  <div class="kicker" id="hdate">E2 model</div>
  <h1 id="htitle">Now</h1>
</header>
<main>
  <section id="v-estrogen" class="view on"></section>
  <section id="v-test" class="view"></section>
  <section id="v-log" class="view"></section>
  <section id="v-data" class="view"></section>
</main>
<nav>
  <button data-v="estrogen" class="on">Estrogen</button>
  <button data-v="test">Testost.</button>
  <button data-v="log">Log</button>
  <button data-v="data">Data</button>
</nav>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
"use strict";
const LN2=Math.LN2;

/* ============================ MODEL (literature, fixed) ============================ */
const M={
  SCALE:2.2161099603352783,               // FITTED: pins total T=90 nmol/L on 21.10.2026 16:00 (re-pinned 25.10.2026 for the two-part enanthate release)
  ester:{
    TE:{kr:LN2/4.0, ke:LN2/0.131, tfrac:288.4/400.6,    // t1/2 4.0d (agreed base), rise 0.131d, DERIVED peak 16h
        f:0.7963, h1:3.521, h2:14.148},                   // release in two parts: 80% with 3.5 d, 20% with 14.1 d (each a constant half-life), fitted so the weekly fall matches Di Luigi's flattening (4.25, 5.8, 7.8 d) scaled to the 4.0 d base, while the first week keeps its 4.0 d pace
    TP:{kr:LN2/(25/24), ke:LN2/0.056, tfrac:288.4/344.5},// t1/2 25h, rise 0.056d, DERIVED peak 6h
    TU:{kr:LN2/31.0, ke:LN2/1.534, tfrac:288.4/456.7}    // t1/2 31d, rise 1.534d, DERIVED peak 7.0d
  },
  KF:1.4, FCAP:5.3, FB2:1, AF:261,                       // E2 conversion on FREE testosterone (nmol/L) at your SHBG: half maximum at free T 1.4, set so a doubling of T gives ~40% more E2 (Lakshman 2010 main finding); above free T 5.3, beyond the study's measured range, it levels off further; AF scales to 112 pmol/L at total T 30, SHBG 9
  FATREF:18.6, FATPER10:1.02,                            // body fat: +2% E2 per 10 points of body fat, same study (fixed, not learned)
  Imax:0.74, L50:0.22,                                   // anastrozole block, literature start (learned)
  aiHL:46.8, aiHLmin:30, aiHLmax:48,                     // anastrozole half-life, hours (Mauras, males), literature start (learned within 30 to 48)
  pmolPerPg:3.6713,
  shbg:9, alb:4.3, Kt:1e9, Kalb:3.6e4,                   // Vermeulen free-T
  refDate:"2026-10-16T16:00",                            // anchor reference day (16:00 default time rule)
  ratio:{crbe:0.799, besw:0.958, swhi:1.056, hiov:1.181} // state cutoffs = ratio x anchor
};
const STATE=[
 {k:"crashed",   name:"Crashed",   desc:"Acute anxiety, sense of doom, adrenaline, chills, flu-like."},
 {k:"below",     name:"Low",     desc:"Flat, dry, dull. Something is missing, not quite content."},
 {k:"sweet_spot",name:"Sweet spot",desc:"Present, energetic, motivated. Opioids and methylphenidate work, libido normal."},
 {k:"high_end",  name:"High",  desc:"Emotional, cries easily, nurturing, slight agitation, functional."},
 {k:"over",      name:"Above ceiling",      desc:"Dreamy, bubble fog, not present, drugs blunted, libido down, dull nagging anxiety."}
];
const SNAME=k=>(STATE.find(s=>s.k===k)||{name:k}).name;
const LOG_NAME={crashed:"Crashed", below:"Low", sweet_spot:"Sweet spot", high_end:"High", over:"Above ceiling"};   // what you log: named by what you can feel
const LNAME=k=>LOG_NAME[k]||k;
/* population normal range for men, measured by mass spectrometry (LC-MS/MS).
   hi 150: Frederiksen 2020 (772 males, Denmark, 50 to 150), agrees with commercial LC-MS lab ranges (147) and Verdonk 2019 (136).
   lo 40: the studies disagree at the bottom (12, 37, 50), so 40 is the middle of that spread and bandLo/bandHi draw the spread as grey.
   typical man 92 pmol/L, middle half 73 to 114 (Framingham, 1148 men, LC-MS/MS; Western Australia mean 95). */
const NORM={lo:40, hi:150, bandLo:12, bandHi:50, typLo:73, typHi:114, typMid:92};
const normName=e=>e<NORM.lo?"Low":e>NORM.hi?"High":"Normal";

const _msCache=new Map();
const ms=s=>{ if(typeof s!=="string") return new Date(s).getTime(); let v=_msCache.get(s); if(v===undefined){ v=new Date(s).getTime(); if(_msCache.size>20000) _msCache.clear(); _msCache.set(s,v); } return v; };   // timestamps parsed once, then remembered
const days=(a,b)=>(a-b)/86400000;
const hours=(a,b)=>(a-b)/3600000;
const pg=p=>p/M.pmolPerPg;

function shape(es,d){ if(d<=0)return 0; const {kr,ke}=M.ester[es];
  return (kr*ke/(ke-kr))*(Math.exp(-kr*d)-Math.exp(-ke*d)); }

function Tcomp(t, hl){ // hl optional {TE,TU,TP} half-life override (chart band); else corrected half-lives
  const H = hl || effHalf();
  const c={TE:0,TP:0,TU:0};
  for(const x of DATA.inj){
    const d=days(t,ms(x.t)); if(d<=0)continue;
    const es=M.ester[x.ester], ke=es.ke;
    const bat=hl=>{ const kr=LN2/hl; return (kr*ke/(ke-kr))*(Math.exp(-kr*d)-Math.exp(-ke*d)); };
    if(x.ester==="TE"){ const r=H.TE/4.0;   // both parts move with the corrected or banded half-life
      c.TE+=es.tfrac*x.mg*(es.f*bat(es.h1*r)+(1-es.f)*bat(es.h2*r)); }
    else c[x.ester]+=es.tfrac*x.mg*bat(H[x.ester]);
  }
  const S=effScale();
  return {total:S*(c.TE+c.TP+c.TU), TE:S*c.TE, TP:S*c.TP, TU:S*c.TU};
}
const Tat=(t,hl)=>Tcomp(t,hl).total;

const AI_ONSET_HALF=0.9; // h; bundles ~2 h drug absorption + estradiol clearing, effect peaks ~5 h not at the timestamp
function aiLoad(t, elimHL, extra){ // anastrozole effect on board, mg, with onset ramp instead of an instant step
  const ke=LN2/elimHL, ka=LN2/AI_ONSET_HALF, f=ka/(ka-ke), doses=extra?DATA.ai.concat(extra):DATA.ai; let L=0;
  for(const x of doses){ const h=hours(t,ms(x.t)); if(h<0)continue; L+=x.mg*f*(Math.exp(-ke*h)-Math.exp(-ka*h)); }
  return L;
}
function Lat(t, extra){ return aiLoad(t, M.aiHL, extra); }
function fatFactor(t){ const bf=bodyfatAt(t); return bf==null?1:Math.pow(M.FATPER10,(bf-M.FATREF)/10); }
function convF(f){ const g=x=>x/(M.KF+x); if(f<=M.FCAP) return g(f);   // study shape where the study measured
  const slope=M.KF/((M.KF+M.FCAP)**2), d=f-M.FCAP; return g(M.FCAP)+slope*M.FB2*d/(M.FB2+d); }   // beyond it: continues, then levels off
function prodE(T,t){ if(!(T>0)) return 0; const sh=t==null?M.shbg:shbgAt(t), f=T*freeT(T,sh)/100; return M.AF*convF(f)*fatFactor(t); }   // estradiol made from free testosterone, before anastrozole
function E2at(t, opt){ // opt {extra, Imax, L50, T, aiHL}
  opt=opt||{};
  const T=(opt.T!=null)?opt.T:Tat(t);
  const L=(opt.aiHL!=null)?aiLoad(t,opt.aiHL,opt.extra):Lat(t,opt.extra);
  const Imax=(opt.Imax!=null)?opt.Imax:M.Imax, L50=(opt.L50!=null)?opt.L50:M.L50;
  const prod=prodE(T,t);
  const block=1-Imax*L/(L+L50);
  return prod*block;
}
function freeT(TT,shbg){ // Vermeulen quadratic, % free
  const T=TT*1e-9, S=shbg*1e-9, albmol=M.alb*10/66500;
  const N=M.Kalb*albmol+1, A=N*M.Kt, B=N+M.Kt*(S-T), C=-T;
  const F=(-B+Math.sqrt(B*B-4*A*C))/(2*A);
  return 100*F/T;
}

/* ----- anchors, cutoffs, states ----- */
function cutoffs(anchor,R){ R=R||M.ratio; return {
  crbe:R.crbe*anchor, besw:R.besw*anchor,
  swhi:R.swhi*anchor, hiov:R.hiov*anchor }; }
function stateOf(e,cut){
  if(e<cut.crbe)return "crashed"; if(e<cut.besw)return "below";
  if(e<cut.swhi)return "sweet_spot"; if(e<cut.hiov)return "high_end"; return "over"; }
function bandOf(k,cut){
  const lo={crashed:0,below:cut.crbe,sweet_spot:cut.besw,high_end:cut.swhi,over:cut.hiov}[k];
  const hi={crashed:cut.crbe,below:cut.besw,sweet_spot:cut.swhi,high_end:cut.hiov,over:null}[k];
  return [lo,hi];
}
const anchorModel=()=>E2at(ms(M.refDate));

/* ----- learning engine ----- */
const SUPER_SURE=3;          // a super sure log counts 3x on the scale (was 5x; changed 25.10 at Jonas's request: it pins a point, not the width)
const UNSURE_TOL=0.03;       // an unsure log is kept if it sits within 3% of where the sure logs put you
const MIN_W=0.03;           // every state keeps at least 3% of the sweet spot in width, so contradictory logs cannot squeeze a range to nothing
const CONFLICT_MARGIN=0.02;  // a Low or High log contradicts a sweet spot log when it sits the wrong way round by more than 2%
const WIN={sweet_spot:10, below:8, high_end:8, crashed:8, over:8};   // sliding windows: your last 10 sweet spot logs, last 8 of each other state
const DRUG_FULL=10;          // anastrozole strength and clearance: fully yours after 10 real-time logs (each counts once, super sure too), then every log counts the same forever
const START_MID={below:2*M.ratio.besw-1, high_end:2*M.ratio.swhi-1};   // starting middles for Low and High, set so the first lines sit at 96% and 106%
const conf=r=>r.superSure?SUPER_SURE:1;
const confRank=r=>(r.superSure?2:(r.sure===false?0:1))*2+(r.timeDefault?0:1);   // confidence first; at equal confidence a log with a real time outranks one with a guessed time
function anchorSeries(k){ const live=Math.round(hisParams().anchor), arr=(DATA.anchorLog||[]).map(s=>s.a);
  if(!arr.length||arr[arr.length-1]!==live) arr.push(live);   // always end on the current live value so it matches
  return arr.slice(-k); }
function snapshotAnchor(force){ if(!DATA.anchorLog)DATA.anchorLog=[]; const n=DATA.reports.length;
  if(!force && n%10!==0) return;
  const last=DATA.anchorLog[DATA.anchorLog.length-1];
  if(last&&last.n===n) return;
  DATA.anchorLog.push({n, a:Math.round(hisParams().anchor)}); }
const ratioMap=R=>({crashed:[0,R.crbe],below:[R.crbe,R.besw],sweet_spot:[R.besw,R.swhi],high_end:[R.swhi,R.hiov],over:[R.hiov,1e9]});
const ARATIO=ratioMap(M.ratio);
function isStartDay(r){ return r.state==="sweet_spot" && r.t===M.refDate; }   // 16.10 counts once: as the start, not again as a log
function weight(){ return hisParams().w; }
function fitLevel(rows, startE, startW, AR){ AR=AR||ARATIO;   // weighted votes in log space: start + every log; returns the sweet spot level A (pmol/L)
  const lnS=Math.log(startE), n=rows.length, W=new Float64Array(n), P=new Float64Array(n), LO=new Float64Array(n), HI=new Float64Array(n), SW=new Uint8Array(n);
  for(let i=0;i<n;i++){ const x=rows[i], le=Math.log(x.e); W[i]=x.w;   // logs and limits computed once, not on every step of the search
    if(x.k==="sweet_spot"){ SW[i]=1; P[i]=le; continue; }
    const b=AR[x.k]; LO[i]=b[1]>=1e9?-Infinity:le-Math.log(b[1]); HI[i]=b[0]<=0?Infinity:le-Math.log(b[0]); }
  const cost=lnA=>{ let c=startW*(lnA-lnS)**2;
    for(let i=0;i<n;i++){ if(SW[i]){ const d=lnA-P[i]; c+=W[i]*d*d; continue; }

function e2t(w,hl){ // E2 with a custom testosterone-release band (for falling)

  const dnMid=crossDn(w=>e2t(w,null));

    const lo=crossUp(w=>e2ai(w,M.aiHL*0.9)), hi=crossUp(w=>e2ai(w,M.aiHL*1.1)); // fast clearance earliest, slow latest

/* ----- blood-draw planner ----- */
function crossDate(thr,hl){

function bloodPlan(thr){

/* ===================== BLOOD CORRECTION (AUC-conserving local sensitivity) ===================== */
const HLVAL={TE:4.0,TU:31,TP:25/24}, HLLO={TE:3.4,TU:29,TP:19/24}, HLHI={TE:4.2,TU:34,TP:25/24};

function loadCorr(){ try{const j=localStorage.getItem("e2corr"); if(j)return JSON.parse(j);}catch(e){}

function saveCorr(){ try{localStorage.setItem("e2corr",JSON.stringify(CORR));}catch(e){} }
function effHalf(){ return {TE:HLVAL.TE*(1+CORR.dTE), TU:HLVAL.TU*(1+CORR.dTU), TP:HLVAL.TP*(1+CORR.dTP)}; }
function effScale(){ return M.SCALE*CORR.S; }

function contribEster(date,es,halflife){ const e=M.ester[es], ke=e.ke, kr=LN2/halflife; let c=0;

    let cmin=cval,cmax=cval;                            // reachable contribution over the clamp

function solveHalf(date,es,targetContrib){ // bisect half-life in clamp to hit a target contribution; clamp if out of range

function recomputeCorrection(){ if(typeof bumpRev==="function") bumpRev(); // re-derive CORR from ALL logged draws (accumulate, never replace)

  const draws=(DATA.blood||[]).filter(b=>b.tt>0).sort((a,b)=>ms(a.t)-ms(b.t));
  CORR.nDraws=draws.length;
  if(draws.length===0){ saveCorr(); return; }
  if(draws.length===1){                               // provisional: share by local sensitivity, scale takes overflow, closes exactly
    const a=attribute(draws[0]), date=draws[0].t, pred0=Tat(ms(date));

  }

// Day 49 is not a gate: its calculated 2.33 equals baseline's at higher SHBG, impossible for Vermeulen, so it is reported only.
const DILUIGI_PAIRS=[
  {lab:"baseline",TT:3.12, S:20.0, calc:2.33, meas:2.32, gate:true},
  {lab:"day 7",   TT:35.71,S:16.2, calc:3.13, meas:3.26, gate:true},
  {lab:"day 14",  TT:13.52,S:16.8, calc:2.74, meas:2.92, gate:true},
  {lab:"day 21",  TT:7.63, S:18.6, calc:2.51, meas:2.72, gate:true},
  {lab:"day 49",  TT:3.12, S:21.2, calc:2.33, meas:2.79, gate:false}
];
function runChecks(){
  const out=[], push=(name,pass,detail)=>out.push({name,pass,detail});
  const inj0=Math.min(...DATA.inj.map(x=>ms(x.t))), ai0=Math.min(...DATA.ai.map(x=>ms(x.t)));
  push("No testosterone counted before its timestamp", Tat(inj0-3600000)===0, "T 1 h before first injection = "+Tat(inj0-3600000).toFixed(2));
  push("No anastrozole counted before its timestamp", Lat(ai0-3600000)===0, "load 1 h before first dose = "+Lat(ai0-3600000).toFixed(4));
  const totalAI=DATA.ai.reduce((a,x)=>a+x.mg,0); let maxL=0;
  for(let h=0;h<=220*24;h+=6) maxL=Math.max(maxL,Lat(inj0+h*3600000));
  push("Anastrozole load never exceeds total administered", maxL<=totalAI+1e-9, "max "+maxL.toFixed(3)+" of "+totalAI.toFixed(2)+" mg");
  let bounded=true, bad="";
  for(let h=0;h<=220*24;h+=6){ const w=inj0+h*3600000, T=Tat(w), e=E2at(w);
    if(!(T>=0&&T<2000&&e>=0&&e<800)){ bounded=false; bad="T="+T.toFixed(0)+" E2="+e.toFixed(0); break; } }
  push("Outputs within physiological bounds", bounded, bounded?"T<2000 nmol/L, 0<E2<800 pmol/L across 220 d":bad);
  const r20=freeT(20,9)/freeT(20,20), r150=freeT(150,9)/freeT(150,20);
  push("Free-T: +26% at T 20 (SHBG 9 vs 20)", Math.abs(r20-1.26)<0.03, "ratio "+r20.toFixed(3));
  push("Free-T: +7% at T 150 (SHBG 9 vs 20)", Math.abs(r150-1.07)<0.03, "ratio "+r150.toFixed(3));
  push("Free-T physiological at T 90", freeT(90,9)>3&&freeT(90,9)<5, freeT(90,9).toFixed(2)+"%");
  let dlOk=true, worst=0, wl="";
  for(const p of DILUIGI_PAIRS.filter(p=>p.gate)){ const d=Math.abs(freeT(p.TT,p.S)-p.calc); if(d>worst){worst=d;wl=p.lab;} if(d>0.05)dlOk=false; }
  push("Di Luigi free fractions, calculated column", dlOk, `worst gate point ${wl} ${worst.toFixed(3)} pp (tol 0.05); day 49 excluded, its 2.33 cannot come from SHBG 21.2`);
  const hp=hisParams();
  push("16.10 counts once, as the start", !hp.vr.used.some(isStartDay), "start day excluded from the logs");
  push("Ranges ordered, sweet range contains 100%", hp.ratio.crbe<hp.ratio.besw&&hp.ratio.besw<1&&1<hp.ratio.swhi&&hp.ratio.swhi<hp.ratio.hiov, [hp.ratio.crbe,hp.ratio.besw,hp.ratio.swhi,hp.ratio.hiov].map(x=>x.toFixed(3)).join(" / "));
  push("Clearance within 30 to 48 h", hp.aiHL>=M.aiHLmin-1e-9&&hp.aiHL<=M.aiHLmax+1e-9, hp.aiHL.toFixed(1)+" h");
  push("Conversion curve on free testosterone", Math.abs(prodE(30,null)/fatFactor(null)-112)<1.5 && prodE(60,null)/prodE(30,null)>1.35 && prodE(60,null)/prodE(30,null)<1.5, `112 pmol/L at total 30; doubling to 60 gives +${r0((prodE(60,null)/prodE(30,null)-1)*100)}%`);
  return out;
}

function stackedChart(nowT, back, fwd, yMax){ // per-ester contribution to total T
  const W=680,H=180,padL=42,padR=8,padT=14,padB=30, short=back<=12;
  const tMin=nowT-back*3600000, tMax=nowT+fwd*3600000, N=90;
  const X=t=>padL+(t-tMin)/(tMax-tMin)*(W-padL-padR), Y=v=>padT+(1-v/yMax)*(H-padT-padB);
  const pts=[]; for(let i=0;i<=N;i++){ const t=tMin+(tMax-tMin)*i/N; pts.push({t,c:Tcomp(t)}); }
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">`;
  s+=`<rect x="${X(nowT).toFixed(1)}" y="${padT}" width="${(W-padR-X(nowT)).toFixed(1)}" height="${H-padT-padB}" fill="rgba(95,122,134,0.08)"/>`;
  let base=pts.map(()=>0);
  for(const es of ["TU","TE","TP"]){                       // stack: undecanoate base, enanthate, propionate on top
    const top=pts.map((p,i)=>base[i]+p.c[es]); let d="";
    pts.forEach((p,i)=>{ d+=(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(top[i]).toFixed(1)+" "; });
    for(let i=pts.length-1;i>=0;i--) d+="L"+X(pts[i].t).toFixed(1)+" "+Y(base[i]).toFixed(1)+" ";
    s+=`<path d="${d}Z" fill="${ESTCOL[es]}" opacity="0.72"/>`; base=top;
  }
  let tl=""; pts.forEach((p,i)=>{ tl+=(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.c.total).toFixed(1)+" "; });
  s+=`<path d="${tl}" fill="none" stroke="#EAF4F8" stroke-width="1" opacity="0.55"/>`;
  const nx=X(nowT).toFixed(1);
  s+=`<line x1="${nx}" y1="${padT}" x2="${nx}" y2="${H-padB}" stroke="#4DB8D9" opacity="0.85"/><text x="${nx}" y="${padT+9}" fill="#4DB8D9" font-family="${MONO}" font-size="9" text-anchor="middle">now</text>`;
  for(const v of [0,yMax/2,yMax]){ const y=Y(v).toFixed(1); s+=`<text x="${padL-4}" y="${(+y+3).toFixed(1)}" fill="#5F7A86" font-family="${MONO}" font-size="9" text-anchor="end">${Math.round(v)}</text>`; }
  const tk=short?4:5;
  for(let i=0;i<=tk;i++){ const t=tMin+(tMax-tMin)*i/tk, x=X(t).toFixed(1); const lab=short?new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit"}); s+=`<text x="${x}" y="${H-padB+13}" fill="#5F7A86" font-family="${MONO}" font-size="8.5" text-anchor="middle">${lab}</text>`; }
  s+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="rgba(77,184,217,0.16)"/></svg>`;
  return s;
}

function trendNow(t){ // momentum (bands/day) + time to next boundary, on current dosing, no new testosterone
  const cut=cutoffs(anchorModel()), e0=E2at(t), slope=E2at(t+24*3600000)-e0;
  const band=cut.swhi-cut.besw;                 // one state width, about 0.1 x anchor
  const bpd=Math.abs(slope)/band;               // bands per day
  if(bpd<0.15) return {dir:"steady"};
  const dir=slope>0?"rising":"falling";
  const rate = bpd<0.33?"slow": bpd<=1.33?"moderate":"fast";   // under 1/3 band, 1/3 to 1 1/3, over
  const bs=[cut.crbe,cut.besw,cut.swhi,cut.hiov];
  const target = dir==="rising" ? bs.filter(b=>b>e0+0.5).sort((a,b)=>a-b)[0] : bs.filter(b=>b<e0-0.5).sort((a,b)=>b-a)[0];
  let nextState=null,lo=null,hi=null;
  if(target!=null){
    const cross=hl=>{ for(let h=0;h<=14*24;h+=1){ const e=e2ai(t+h*3600000,hl); if(dir==="rising"?e>=target:e<=target) return h/24; } return null; };

    nextState=SNAME(dir==="rising"?stateOf(target+0.1,cut):stateOf(target-0.1,cut));
  }
  return {dir, rate, slope, nextState, lo, hi};
}

  const n=Math.max(200,Math.ceil((t1-t0)/(20*60000)));   // at most 20 minutes between samples
  let pt=t0, pv=lvl(fn(t0));
  for(let i=1;i<=n;i++){ const tt=t0+(t1-t0)*i/n; let a0=pt;
    while(lvl(fn(tt))!==pv){ let a=a0,b=tt; while(b-a>60000){ const m=(a+b)/2; if(lvl(fn(m))===pv) a=m; else b=m; }
      const nl=lvl(fn(b)); out.push({t:b,to:NAMES[nl],up:nl>pv}); pv=nl; a0=b; if(out.length>200) return out; }
    pt=tt; }
  return out; }

function inR(x,lo,hi,lab){ if(x>=lo&&x<=hi) return true; toast(`${lab} must be ${lo} to ${hi}`); return false; }
function todayISO(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function dtField(idD,idT,dd,tt){ const arrow=`flex:0 0 auto;width:40px;min-height:52px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--accent);font-size:20px;line-height:1;cursor:pointer`;
  return `<div class="two">
  <label class="fl"><div class="field-lab">Date</div>
    <div style="display:flex;gap:6px">
      <button type="button" onclick="shiftDay('${idD}',-1)" style="${arrow}">&lsaquo;</button>
      <input type="date" id="${idD}" value="${dd}" style="flex:1;min-width:0">
      <button type="button" onclick="shiftDay('${idD}',1)" style="${arrow}">&rsaquo;</button>
    </div></label>
  <label class="fl"><div class="field-lab">Time (24h)</div><input type="text" id="${idT}" class="tfield" value="${tt}" inputmode="numeric" placeholder="16:00" maxlength="5"></label></div>`; }
function shiftDay(id,delta){ const el=$("#"+id); if(!el)return; const p=(el.value||todayISO()).split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()+delta);
  el.value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function future(t){ if(ms(t)>Date.now()+24*3600000){ toast("That time is more than a day ahead. Check the date."); return true; } return false; }   // typo guard: no logs dated more than a day ahead
function readDT(idD,idT){ const d=$("#"+idD).value, raw=($("#"+idT).value||"").trim();
  let h,mn, m=raw.match(/^(\d{1,2}):([0-5]\d)$/);
  if(m){ h=+m[1]; mn=m[2]; }
  else { const dig=raw.replace(/\D/g,"");
    if(dig.length===4){ h=+dig.slice(0,2); mn=dig.slice(2); }
    else if(dig.length===3){ h=+dig.slice(0,1); mn=dig.slice(1); }
    else return null; }
  if(!d||h>23||+mn>59) return null;
  return d+"T"+String(h).padStart(2,"0")+":"+mn; }
function wireTimeInputs(){ document.querySelectorAll(".tfield").forEach(inp=>{
  inp.addEventListener("input",()=>{ const dig=inp.value.replace(/\D/g,"").slice(0,4);
    inp.value = dig.length===4 ? dig.slice(0,2)+":"+dig.slice(2) : dig; }); }); }
function openInfoRaw(title,body){ $("#sheet").innerHTML=`<h4>${title}</h4><p>${body}</p>`; $("#sheetbg").classList.add("on"); }
function recentList(){
  const items=[];
  DATA.inj.forEach(x=>items.push({t:x.t,txt:`${x.mg} mg ${({TE:"enanthate",TU:"undecanoate",TP:"propionate"})[x.ester]}`,tag:"inj"}));
  DATA.ai.forEach(x=>items.push({t:x.t,txt:`${x.mg} mg anastrozole`,tag:"ai"}));

  (DATA.factors||[]).forEach(x=>{ const p=[]; if(x.weight!=null)p.push(`${x.weight} kg`); if(x.bodyfat!=null)p.push(`${x.bodyfat}% fat`); if(x.shbg!=null)p.push(`SHBG ${x.shbg}`); items.push({t:x.t,txt:`body: ${p.join(", ")}`,tag:"body"}); });

function svgChart(cfg){
  const W=680,H=430,padL=(cfg.hideY?12:46),padR=12,padT=18,padB=42, now=cfg.nowT;
  const tMin=now-cfg.back*3600000, tMax=now+cfg.fwd*3600000, short=(cfg.back+cfg.fwd)<=24;
  const X=t=>padL+(t-tMin)/(tMax-tMin)*(W-padL-padR);
  const Y=v=>padT+(1-(v-cfg.yMin)/(cfg.yMax-cfg.yMin))*(H-padT-padB);
  const start=cfg.blackoutBefore?Math.max(tMin,cfg.blackoutBefore):tMin, N=100;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">`;
  for(const sh of (cfg.shades||[])) s+=`<rect x="${padL}" y="${Y(sh.y1).toFixed(1)}" width="${(W-padL-padR).toFixed(1)}" height="${Math.abs(Y(sh.y0)-Y(sh.y1)).toFixed(1)}" fill="${sh.color}"/>`;
  s+=`<rect x="${X(now).toFixed(1)}" y="${padT}" width="${(W-padR-X(now)).toFixed(1)}" height="${H-padT-padB}" fill="rgba(95,122,134,0.08)"/>`;
  for(const hl of (cfg.hlines||[])){ const y=Y(hl.y).toFixed(1);
    s+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${hl.color}" stroke-width="1" stroke-dasharray="${hl.dash||'4 4'}"/>`;
    if(hl.label) s+=`<text x="${(W-padR-2)}" y="${(+y-3).toFixed(1)}" fill="${hl.color}" font-family="${MONO}" font-size="9" text-anchor="end" letter-spacing="1">${hl.label}</text>`; }
  const pts=[]; for(let i=0;i<=N;i++){ const t=start+(tMax-start)*i/N; pts.push({t,lo:cfg.lo(t),hi:cfg.hi(t),c:cfg.center(t)}); }
  let up=""; pts.forEach((p,i)=>{ up+=(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.hi).toFixed(1)+" "; });
  for(let i=pts.length-1;i>=0;i--) up+="L"+X(pts[i].t).toFixed(1)+" "+Y(pts[i].lo).toFixed(1)+" ";
  s+=`<path d="${up}Z" fill="${cfg.bandColor||'rgba(77,184,217,0.15)'}"/>`;
  let cl=""; pts.forEach((p,i)=>{ cl+=(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.c).toFixed(1)+" "; });
  s+=`<path d="${cl}" fill="none" stroke="${cfg.centerColor||'#4DB8D9'}" stroke-width="1.6"/>`;
  if(cfg.overlay){ let o=""; for(let i=0;i<=N;i++){ const t=start+(tMax-start)*i/N; o+=(i?"L":"M")+X(t).toFixed(1)+" "+Y(cfg.overlay.fn(t)).toFixed(1)+" "; }
    s+=`<path d="${o}" fill="none" stroke="${cfg.overlay.color}" stroke-width="1.9"/>`; }
  if(cfg.preview){ const s0=Math.max(now,start); let pv="";
    for(let i=0;i<=N;i++){ const t2=s0+(tMax-s0)*i/N; pv+=(i?"L":"M")+X(t2).toFixed(1)+" "+Y(cfg.preview.fn(t2)).toFixed(1)+" "; }
    s+=`<path d="${pv}" fill="none" stroke="${cfg.preview.color}" stroke-width="1.8" stroke-dasharray="5 3"/>`; }
  if(cfg.line2){ const L=cfg.line2, lm=L.max||1, yy=v=>padT+(1-Math.max(0,Math.min(1,v/lm)))*(H-padT-padB);
    const s0=cfg.line2.blackoutBefore?Math.max(tMin,cfg.line2.blackoutBefore):tMin;
    let p2=""; for(let i=0;i<=N;i++){ const t=s0+(tMax-s0)*i/N; p2+=(i?"L":"M")+X(t).toFixed(1)+" "+yy(L.fn(t)).toFixed(1)+" "; }
    s+=`<path d="${p2}" fill="none" stroke="${L.color}" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.9"/>`;
    s+=`<text x="${padL+3}" y="${padT+10}" fill="${L.color}" font-family="${MONO}" font-size="9">${L.label}</text>`; }
  if(cfg.blackoutBefore&&cfg.blackoutBefore>tMin){ const x=X(cfg.blackoutBefore);
    s+=`<rect x="${padL}" y="${padT}" width="${(x-padL).toFixed(1)}" height="${H-padT-padB}" fill="rgba(4,12,16,0.6)"/>`;
    s+=`<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="#5D7488" stroke-dasharray="3 3"/>`;
    s+=`<text x="${(x-4).toFixed(1)}" y="${padT+10}" fill="#5F7A86" font-family="${MONO}" font-size="9" text-anchor="end">unlogged AI</text>`; }
  if(cfg.crossings&&cfg.crossings.length){ const rows=[], CW=7.4;   // label font 12 in a 680-wide chart, about 6.5 px on a phone
    for(const c of cfg.crossings){ if(c.t<tMin||c.t>tMax) continue; const x=X(c.t), d=new Date(c.t);
      const hm=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}), dm=d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit"});
      const txt=(short?hm:`${dm} ${hm}`)+" "+(c.up?"\u2191":"\u2193")+" "+c.to, w=txt.length*CW+8;
      const right=x+w>W-padR; const x0=right?x-w:x;
      let r=0; while(rows[r]!=null && x0<rows[r]+4) r++; rows[r]=x0+w;
      const y=padT+26+r*17;
      s+=`<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="#9FBAC6" stroke-width="1" stroke-dasharray="2 3" opacity="0.8"/>`;
      s+=`<rect x="${(right?x-w:x).toFixed(1)}" y="${(y-12).toFixed(1)}" width="${w.toFixed(1)}" height="16" rx="3" fill="rgba(6,24,31,0.88)"/>`;

  const nx=X(now).toFixed(1);

  for(const p of (cfg.points||[])){ if(p.t<tMin||p.t>tMax)continue; const x=X(p.t).toFixed(1), y=Y(p.y).toFixed(1);
    s+=`<circle cx="${x}" cy="${y}" r="4.6" fill="rgba(6,24,31,0.9)" stroke="${p.color||'#EAF4F8'}" stroke-width="1.8"/>`; }
  if(!cfg.hideY) for(const v of [cfg.yMin,(cfg.yMin+cfg.yMax)/2,cfg.yMax]){ const y=Y(v).toFixed(1);
    s+=`<text x="${padL-5}" y="${(+y+5).toFixed(1)}" fill="#9FBAC6" font-family="${MONO}" font-size="15" text-anchor="end">${Math.round(v)}</text>`; }
  const tk=short?4:5;
  for(let i=0;i<=tk;i++){ const t=tMin+(tMax-tMin)*i/tk, x=X(t);
    const lab=short?new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit"});

function refBar(r0_,now,nowLabel,typ,unc){   // one horizontal bar: Low, Normal, High, with a typical zone and a marker for you now; the bar stretches to fit you

  const lab=(a,b,t,need)=>x(b)-x(a)>=need?`<text x="${(x(a)+x(b))/2}" y="31" fill="var(--text)" font-size="9" text-anchor="middle">${t}</text>`:"";   // a label only where it fits

    ${lab(0,r.low,"Low",22)}${lab(r.low,r.high,"Normal",36)}${lab(r.high,r.axis,"High",24)}
    <polygon points="${x(now)-5},6 ${x(now)+5},6 ${x(now)},15" fill="var(--accent)"/>

function parseImport(txt){   // checks an export before anything is replaced

  const bad=[...d.inj,...d.ai,...d.reports].some(x=>!x||typeof x.t!=="string"||isNaN(ms(x.t)));

let curView="estrogen";
const TITLES={estrogen:"Estrogen",test:"Testosterone",log:"Log",data:"Data"};
function show(v){
  curView=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#htitle").textContent=TITLES[v];
  if(v==="estrogen")renderEstrogen(); if(v==="test")renderTest(); if(v==="log")renderLog(); if(v==="data")renderData();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
let tT;
function toast(m){ if(Date.now()-saveFailAt<500) m="Save blocked, export a backup"; const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tT); tT=setTimeout(()=>el.classList.remove("on"),1600); }

$("#hdate").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}).toUpperCase();
setShbgFromBlood();
if(DATA.blood&&DATA.blood.length) recomputeCorrection();
if(!DATA.anchorLog||!DATA.anchorLog.length){ snapshotAnchor(true); save(); }
(function(){ const fails=runChecks().filter(r=>r.pass===false);
  if(fails.length){ const b=document.createElement("div"); b.className="card alert"; b.style.margin="12px 16px 0";
    b.innerHTML=`<h2>Build check failed</h2><div class="sub">${fails.map(f=>f.name+": "+f.detail).join("<br>")}</div><div class="sub" style="margin-top:6px">See Data, Checks.</div>`;
    document.querySelector("main").prepend(b); } })();
show("estrogen");
// durability: ask the browser not to evict, and recover from IndexedDB if localStorage was cleared
(async()=>{
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  idb=await idbOpen();
  const backup=await idbGet();
  if(backup&&backup.inj&&!loadedFromStore){                 // localStorage was empty but IndexedDB survived
    DATA=backup; normalize(DATA); setShbgFromBlood(); bumpRev();
    if(DATA.blood.length) recomputeCorrection();
    try{ localStorage.setItem("e2model",JSON.stringify(DATA)); }catch(e){}
    show(curView);
  }
  idbSet(DATA);                                             // mirror current state into IndexedDB
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
