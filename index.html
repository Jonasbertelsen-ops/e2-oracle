<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06181F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E2 Model">
<meta name="format-detection" content="telephone=no">
<title>E2 Model</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#040C10; --bg:#06181F; --card:rgba(7,9,12,0.88); --surface:#0B2129;
  --tint:rgba(42,138,143,0.10); --text:#EAF4F8; --muted:#9FBAC6; --faint:#5F7A86;
  --border:rgba(77,184,217,0.16); --border-strong:rgba(77,184,217,0.38);
  --accent:#4DB8D9; --teal:#2A8A8F; --red:#D92E3A; --steel:#5D7488;
  --violet:#5B4FA8; --yellow:#F0C040;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --num:'Oswald',var(--mono);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  --hshadow:0 3px 9px rgba(2,3,5,0.98),0 0 30px rgba(2,3,5,0.95),0 0 60px rgba(2,3,5,0.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--base);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.4}
body{padding-top:env(safe-area-inset-top,0px);min-height:100%}
#fog{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 55% at 82% 8%, rgba(14,74,92,0.95) 0, rgba(14,74,92,0.55) 35%, rgba(6,24,31,0) 70%),
  radial-gradient(70% 70% at 95% 45%, rgba(42,138,143,0.28) 0, rgba(6,24,31,0) 65%),
  radial-gradient(90% 80% at 10% 95%, #020608 0, rgba(2,6,8,0.6) 45%, rgba(6,24,31,0) 75%),
  linear-gradient(200deg, #0E4A5C 0, #083040 35%, #06181F 60%, #030A0E 100%)}
#fog::after{content:"";position:absolute;inset:-20%;opacity:.55;background:
  radial-gradient(45% 45% at 30% 20%, rgba(42,138,143,0.22) 0, rgba(6,24,31,0) 70%),
  radial-gradient(40% 40% at 70% 80%, rgba(14,74,92,0.30) 0, rgba(6,24,31,0) 70%);
  animation:drift 48s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1.05)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){#fog::after{animation:none}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:14px 16px 10px;
  background:linear-gradient(180deg,rgba(4,12,16,0.92),rgba(4,12,16,0.0));backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;
  background:rgba(4,12,16,0.92);backdrop-filter:blur(8px)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.3em;text-transform:uppercase;margin:2px 0 0;text-shadow:var(--hshadow)}
main{padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
.view{display:none;animation:fade .2s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
.card h2{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h3{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;margin:16px 0 6px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--num);font-weight:600;font-size:30px;color:var(--accent);text-shadow:0 0 18px rgba(77,184,217,0.45);line-height:1}
.unit{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.1em}
.state{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.sub{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.divider{height:1px;background:var(--border);margin:12px 0}

.i{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;
  border:1px solid var(--border-strong);color:var(--accent);font-family:var(--mono);font-size:11px;
  background:transparent;cursor:pointer;flex:0 0 auto}
.alert{border-color:var(--yellow);
  background:linear-gradient(180deg,rgba(240,192,64,0.10),rgba(240,192,64,0.02)),rgba(7,9,12,0.88)}
.alert h2{color:var(--yellow)}
.alert .state{color:var(--yellow)}
.notice{border-left:3px solid var(--border-strong);padding:6px 0 6px 12px;margin:10px 0;color:var(--muted);font-size:14px}
.notice.warn{border-left-color:var(--yellow)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.n{font-family:var(--num);color:var(--text)}
tr.conflict td{color:var(--yellow)}

button.act{min-height:52px;width:100%;border-radius:12px;border:1px solid var(--border-strong);
  background:transparent;color:var(--text);font-family:var(--mono);font-weight:700;font-size:13px;
  letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0 14px}
button.primary{background:var(--accent);color:#07090C;border-color:var(--accent);box-shadow:0 0 24px rgba(77,184,217,0.35)}
button.sm{min-height:44px;font-size:12px;letter-spacing:.14em}
input,select{width:100%;min-height:52px;background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:12px;padding:0 14px;font-family:var(--body);font-size:16px}
textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;font-family:var(--body);font-size:16px;min-height:72px;resize:vertical}
label.fl{display:block;margin:12px 0 4px}
.field-lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{flex:1 1 30%;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:0 8px}
.chip.sel{border-color:var(--accent);color:var(--accent);background:var(--tint);box-shadow:0 0 16px rgba(77,184,217,0.25)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(4,12,16,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border)}
nav button{flex:1;min-width:0;background:transparent;border:0;border-top:2px solid transparent;color:var(--faint);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:12px 1px 14px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* five tabs since 5.11.2026: tighter letter-spacing so none of them wraps or clips on a narrow phone */
nav button.on{color:var(--accent);border-top-color:var(--accent);text-shadow:0 0 14px rgba(77,184,217,0.55)}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(2,6,8,0.7);display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:620px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border-strong);
  border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet h4{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.sheet p{margin:8px 0;font-size:15px;color:var(--text)}
.sheet .k{color:var(--muted);font-family:var(--mono);font-size:12px}
.confirm-bg{position:fixed;inset:0;z-index:40;background:rgba(2,6,8,0.88);display:none;align-items:center;justify-content:center;padding:22px}
.confirm-bg.on{display:flex}
.confirm{width:100%;max-width:430px;background:var(--surface);border:2px solid var(--yellow);border-radius:18px;padding:26px 22px;box-shadow:0 0 50px rgba(240,192,64,0.30)}
.confirm.bad{border-color:var(--red);box-shadow:0 0 50px rgba(217,46,58,0.35)}
.ctitle{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);text-align:center;line-height:1.15}
.confirm.bad .ctitle{color:var(--red)}
.csub{text-align:center;color:var(--muted);font-size:14px;margin:10px 0 16px}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:17px}
.crow span{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:999px;padding:10px 18px;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--border);border-radius:999px;padding:2px 8px;display:inline-block}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.menu-btn{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;min-height:56px;margin:8px 0;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);
  font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-align:left}
/* 5.11.2026: the label and its description used to run into each other on a narrow screen
   (ENTRIESEVERYTHING THE MODEL READS). The label now keeps its own width and never shrinks,
   the description takes the rest, wraps instead of overflowing, and a gap holds them apart. */
.menu-btn>b{flex:0 0 auto;font-weight:400}
.menu-btn span{color:var(--faint);flex:1 1 auto;min-width:0;text-align:right;
  letter-spacing:.10em;line-height:1.35;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="fog"></div>
<header>
  <div class="kicker" id="hdate">E2 model</div>
  <h1 id="htitle">Now</h1>
</header>
<main>
  <section id="v-estrogen" class="view on"></section>
  <section id="v-test" class="view"></section>
  <section id="v-log" class="view"></section>
  <section id="v-entries" class="view"></section>
  <section id="v-data" class="view"></section>
</main>
<nav>
  <button data-v="estrogen" class="on">Estrogen</button>
  <button data-v="test">Testost.</button>
  <button data-v="log">Log</button>
  <button data-v="entries">Entries</button>
  <button data-v="data">Data</button>
</nav>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="confirm-bg" id="cbg"><div class="confirm" id="cbox"></div></div>
<div id="toast"></div>

<script>
"use strict";
const LN2=Math.LN2;

/* ============================ MODEL (literature, fixed) ============================ */
const M={
  SCALE:2.2161099603352783,               // FITTED: pins total T=90 nmol/L on 21.10.2026 16:00 (re-pinned 25.10.2026 for the two-part enanthate release)
  ester:{
    TE:{kr:LN2/4.0, ke:LN2/0.131, tfrac:288.4/400.6,    // t1/2 4.0d (agreed base), rise 0.131d, DERIVED peak 16h
        f:0.7963, h1:3.521, h2:14.148},                   // release in two parts: 80% with 3.5 d, 20% with 14.1 d (each a constant half-life), fitted so the weekly fall matches Di Luigi's flattening (4.25, 5.8, 7.8 d) scaled to the 4.0 d base, while the first week keeps its 4.0 d pace
    TP:{kr:LN2/(25/24), ke:LN2/0.056, tfrac:288.4/344.5},// t1/2 25h, rise 0.056d, DERIVED peak 6h
    TU:{kr:LN2/31.0, ke:LN2/1.534, tfrac:288.4/456.7}    // t1/2 31d, rise 1.534d, DERIVED peak 7.0d
  },
  KF:1.4, FCAP:5.3, FB2:1, AF:261,                       // E2 conversion on FREE testosterone (nmol/L) at your SHBG: half maximum at free T 1.4, set so a doubling of T gives ~40% more E2 (Lakshman 2010 main finding); above free T 5.3, beyond the study's measured range, it levels off further; AF scales to 112 pmol/L at total T 30, SHBG 9
  FATREF:18.6, FATPER10:1.02,                            // body fat: +2% E2 per 10 points of body fat, same study (fixed, not learned)
  Imax:0.74, L50:0.22,                                   // anastrozole block, literature start (learned)
  aiHL:46.8, aiHLmin:30, aiHLmax:48,                     // anastrozole half-life, hours (Mauras, males), literature start (learned within 30 to 48)
  pmolPerPg:3.6713,
  shbg:9, alb:4.3, Kt:1e9, Kalb:3.6e4,                   // Vermeulen free-T
  refDate:"2026-10-16T16:00",                            // anchor reference day (16:00 default time rule)
  ratio:{crbe:0.799, besw:0.958, hiov:1.181} // kept only so old code paths that need a ratio still work; the real starting lines are START below
};
/* STARTING STATE LINES, in pmol/L, fixed values. They replace the old ratios of an anchor computed
   from 16.10 at 4 pm, a seeded day whose TIME was a default and whose ratios came from no study.
   That put Crashed at about 90, just under the typical man's 92, and left Low only 11 pmol wide.
   Where these come from:
     77  the floor of the range for men on testosterone (20 pg/mL is 73; raised to 77 because
         Jonas runs 2 to 3 times ordinary TRT levels).
     105 bracketed by his own logs: Low at about 100 on 4.11 (flat, a bit agitated, not symptomatic)
         and his lowest Good logs at 109, including the super sure one of 23.10.
     132 bracketed the same way: highest Good log 126 (19.10 noon), lowest Above-ceiling log 138 (13.10). */
const START={crbe:77, besw:105, hiov:132};
const STATE=[
 {k:"crashed",   name:"Crashed",   desc:"Acute anxiety, sense of doom, adrenaline, chills, flu-like."},
 {k:"below",     name:"Low",     desc:"Flat, dry, dull. Something is missing, not quite content."},
 {k:"sweet_spot",name:"Good",desc:"Present, energetic, motivated. Covers both the calm middle and the emotional upper end, which feel good alike."},
 {k:"over",      name:"Above ceiling",      desc:"Dreamy, bubble fog, not present, drugs blunted, libido down, dull nagging anxiety."}
];
const SNAME=k=>(STATE.find(s=>s.k===k)||{name:k}).name;
const LOG_NAME={crashed:"Crashed", below:"Low", sweet_spot:"Good", high_end:"Good", over:"Above ceiling"};   // what you log: named by what you can feel
const LNAME=k=>LOG_NAME[k]||k;
/* Objective range for MEN ON TESTOSTERONE, not the general population: Jonas's point is that a
   reference group has to be people like him. 147 pmol is 40 pg/mL, the top of the range clinics
   and TRT practice use; its bottom is 73 pmol (20 pg/mL), raised to 77 for his supraphysiological
   testosterone. HONESTY: no guideline sets an estradiol target for men on testosterone. The
   Endocrine Society 2018 guideline and the AUA guideline both say treat symptoms, not a number.
   This range is clinical and community consensus, not trial evidence. The old 40 to 150 came from
   population studies of untreated men and the grey 12 to 50 band belonged to its disputed low end;
   both are gone. */
const NORM={lo:77, hi:147, typLo:88, typHi:132, typMid:110};
const normName=e=>e<NORM.lo?"Low":e>NORM.hi?"High":"Normal";

const _msCache=new Map();
const ms=s=>{ if(typeof s!=="string") return new Date(s).getTime(); let v=_msCache.get(s); if(v===undefined){ v=new Date(s).getTime(); if(_msCache.size>20000) _msCache.clear(); _msCache.set(s,v); } return v; };   // timestamps parsed once, then remembered
const days=(a,b)=>(a-b)/86400000;
const hours=(a,b)=>(a-b)/3600000;
const pg=p=>p/M.pmolPerPg;

function shape(es,d){ if(d<=0)return 0; const {kr,ke}=M.ester[es];
  return (kr*ke/(ke-kr))*(Math.exp(-kr*d)-Math.exp(-ke*d)); }

function Tcomp(t, hl){ // hl optional {TE,TU,TP} half-life override (chart band); else corrected half-lives
  const H = hl || effHalf();
  const c={TE:0,TP:0,TU:0};
  for(const x of DATA.inj){
    const d=days(t,ms(x.t)); if(d<=0)continue;
    const es=M.ester[x.ester], ke=es.ke;
    const bat=hl=>{ const kr=LN2/hl; return (kr*ke/(ke-kr))*(Math.exp(-kr*d)-Math.exp(-ke*d)); };
    if(x.ester==="TE"){ const r=H.TE/4.0;   // both parts move with the corrected or banded half-life
      c.TE+=es.tfrac*x.mg*(es.f*bat(es.h1*r)+(1-es.f)*bat(es.h2*r)); }
    else c[x.ester]+=es.tfrac*x.mg*bat(H[x.ester]);
  }
  const S=effScale();
  return {total:S*(c.TE+c.TP+c.TU), TE:S*c.TE, TP:S*c.TP, TU:S*c.TU};
}
const Tat=(t,hl)=>Tcomp(t,hl).total;

const AI_ONSET_HALF=0.9; // h; bundles ~2 h drug absorption + estradiol clearing, effect peaks ~5 h not at the timestamp
/* Two aromatase inhibitors, and they do not behave alike.
   Anastrozole sits on the enzyme and lets go, so its effect fades as the drug clears (the learned 30 to 48 h).
   Exemestane destroys the enzyme permanently, so its effect fades only as new aromatase is built, over days, no matter how fast the drug clears.
   Strength: 25 mg exemestane daily and 1 mg anastrozole daily are the clinically equivalent doses (comparative studies found the two inhibit aromatisation about equally), so 1 mg exemestane counts as 1/25 mg anastrozole.
   Rebuild: measured in males, see the exemestane block below. */
/* EXEMESTANE, recalibrated 5.11.2026 against the full Mauras 2003 paper (Jonas supplied the paper itself).
   SOURCE: Mauras N et al, J Clin Endocrinol Metab 88(12):5951-5956, doi 10.1210/jc.2003-031279. Ten healthy
   young males, single oral 25 mg, blood at 0,1,2,3,4,8,12,24,48,72,144,240 h. This is the only published
   single-dose male time course of exemestane, which is why it alone sets the shape of this curve.
   WHAT THE PAPER MEASURED: drug terminal half-life 8.9 h (the paper notes this is far shorter than the 27 h
   published in women, and attributes the difference to a real sex difference in volume of distribution and
   protein binding). Maximal estradiol suppression 62 +/- 14% at 12 h. Still suppressed 58 +/- 21% at 24 h.
   Returned to baseline 3 to 6 days after the dose.
   THE CURVE FITTED HERE: Jonas built a reference profile for himself from that paper, reading the decline as a
   line from the 12 h peak through the 24 h point and biasing toward the faster end of the authors' 3 to 6 day
   recovery window, since he sits at the fast end of it. His profile for 25 mg: 55-65% at 12 h, 50-60% at 24 h,
   30-45% at 48 h, 0-15% at 72 h, 0-5% at 96 h, nothing from day 5. The three constants below were fitted by
   least squares to the midpoints of those bands and reproduce them: 60% at 12 h, 56% at 24 h, 34% at 48 h,
   12% at 72 h, 3% at 96 h, 0.5% at day 5. They also reproduce the paper's own three published figures.
   At his own 16.25 mg: 55% at 12 h, half of that gone by 36 h, 8% left at day 3, nothing by day 5.
   THE "onset" FIELD IS A RISE CONSTANT, NOT A DELAY. Exemestane plasma levels peak about 1 h after the dose
   and it inactivates the enzyme irreversibly, so the block begins within the first hours and then accumulates
   to the 12 h mark; the paper simply has no sampled percentages between 1 h and 12 h. The fitted curve behaves
   that way: at 25 mg it is already 36% at 1 h, 52% at 3 h, 58% at 6 h, and only then levels off at 60% by 12 h.
   The 6.6 figure is the half-time of that rise inside the two-exponential, chosen by the fit; it is not a lag
   before anything happens, and nothing in the paper measures it directly.
   WHAT CHANGED AND WHY: fade half-life 46 h -> 10.0 h, rise half-time 5 -> 6.6 h, strength per mg 0.0328 -> 0.0874.
   The old 46 h was derived from the tail of a postmenopausal-women study. Jonas's standing rule is that the
   women's numbers do not transfer: a postmenopausal woman makes almost no estradiol, so her level drains
   slowly to its floor, while he produces it continuously and his level follows the enzyme within hours. The
   male paper measures recovery directly, so it replaces the borrowed figure outright.
   KNOWN TENSION, recorded rather than resolved: 10 h is close to the drug's own 8.9 h half-life. Exemestane
   inactivates the enzyme irreversibly, so recovery should track aromatase resynthesis, which is slower than
   drug clearance. The male data nonetheless shows recovery by day 3 to 6. The measurement is kept over the
   mechanism; if his own logs later show the effect outlasting this curve, the fade half-life is the number to
   lengthen. ORIGIN NOT RECORDED for why the authors' two timings differ beyond their own stated speculation.
   STRENGTH AGAINST ANASTROZOLE: per is the anastrozole-equivalent mg per mg of exemestane, fitted here rather
   than taken from the clinical-equivalence ratio, because the block depth and the fade are fitted together. */
const AI_KIND={ anastrozole:{per:1, hl:null, onset:null, label:"Anastrozole", lo:0.01, hi:2},

function crossDate(thr,hl){
  const t0=Date.now();
  for(let h=0;h<=80*24;h+=6){ const w=t0+h*3600000; if(Tat(w,hl)<thr) return w; }
  return null;
}
function bloodPlan(thr){
  const central=crossDate(thr,null);
  const early=crossDate(thr,{TE:3.4,TU:29,TP:19/24});   // fast release -> earliest
  const late =crossDate(thr,{TE:4.2,TU:34,TP:25/24});   // slow release -> latest (conservative)
  let share=null;
  if(late){ const c=Tcomp(late,{TE:4.2,TU:34,TP:25/24}); share=Math.round(100*c.TU/c.total); }
  return {central,early,late,share};
}

/* ===================== BLOOD CORRECTION (AUC-conserving local sensitivity) ===================== */
const HLVAL={TE:4.0,TU:31,TP:25/24}, HLLO={TE:3.4,TU:29,TP:19/24}, HLHI={TE:4.2,TU:34,TP:25/24};
const SIGMA0={TE:0.4/3.8, TU:2.5/31.5, TP:3/22};   // prior half-width / centre
let CORR=loadCorr();
function loadCorr(){ try{const j=localStorage.getItem("e2corr"); if(j)return JSON.parse(j);}catch(e){}
  return {dTE:0,dTU:0,dTP:0,S:1,provisional:false,nDraws:0,informs:{TE:0,TU:0,TP:0}}; }
function saveCorr(){ try{localStorage.setItem("e2corr",JSON.stringify(CORR));}catch(e){} }
function effHalf(){ return {TE:HLVAL.TE*(1+CORR.dTE), TU:HLVAL.TU*(1+CORR.dTU), TP:HLVAL.TP*(1+CORR.dTP)}; }
function effScale(){ return M.SCALE*CORR.S; }
function sigmaNow(es){ return SIGMA0[es]/Math.pow(2, (CORR.informs[es]||0)/2); } // shrink /sqrt2 per informing draw

function contribEster(date,es,halflife){ const e=M.ester[es], ke=e.ke, kr=LN2/halflife; let c=0;
  for(const x of DATA.inj){ if(x.ester!==es)continue; const d=days(ms(date),ms(x.t)); if(d<=0)continue;
    c+=e.tfrac*x.mg*(kr*ke/(ke-kr))*(Math.exp(-kr*d)-Math.exp(-ke*d)); }
  return effScale()*c; }

function attribute(draw){ // single-draw attribution for display and provisional apply
  const date=draw.t, pred=Tat(ms(date)), meas=draw.tt, gap=pred>0?(meas-pred)/pred:0, dir=Math.sign(gap)||1;
  const H=effHalf(), plasma={}, cap={}, w={}; let wsum=0;
  for(const es of ["TE","TU","TP"]){
    const cval=contribEster(date,es,H[es]); plasma[es]=pred>0?cval/pred:0;
    let cmin=cval,cmax=cval;                            // reachable contribution over the clamp
    for(let f=0;f<=1.0001;f+=0.1){ const hl=HLLO[es]+(HLHI[es]-HLLO[es])*f; const c=contribEster(date,es,hl);
      if(c<cmin)cmin=c; if(c>cmax)cmax=c; }
    cap[es] = dir>0 ? (cmax-cval)/pred : (cmin-cval)/pred;   // max value-change toward the gap (0 near a crossover)
    w[es]=plasma[es]*sigmaNow(es)**2; wsum+=w[es];
  }
  for(const es in w) w[es]= wsum>0? w[es]/wsum : 0;
  let alloc={TE:0,TU:0,TP:0}, remaining=gap, active=new Set(["TE","TU","TP"].filter(es=>Math.abs(cap[es])>1e-9&&w[es]>0));
  for(let it=0; it<4 && active.size; it++){ let ws=0; active.forEach(es=>ws+=w[es]); if(ws<=0)break; let capped=false; const snap=remaining;
    active.forEach(es=>{ const want=snap*w[es]/ws; if(Math.abs(want)>=Math.abs(cap[es])){ alloc[es]=cap[es]; remaining-=cap[es]; active.delete(es); capped=true; } });
    if(!capped){ active.forEach(es=>{ alloc[es]=snap*w[es]/ws; }); remaining=0; active.clear(); } }
  const esterTot=alloc.TE+alloc.TU+alloc.TP, scalePortion=gap-esterTot;
  const dom=["TE","TU","TP"].sort((a,b)=>plasma[b]-plasma[a])[0];
  return {date,pred,meas,gap,plasma,cap,alloc,scalePortion,dom,w};
}

function solveHalf(date,es,targetContrib){ // bisect half-life in clamp to hit a target contribution; clamp if out of range
  let lo=HLLO[es],hi=HLHI[es], clo=contribEster(date,es,lo), chi=contribEster(date,es,hi);
  if((targetContrib-clo)*(targetContrib-chi)>0) return Math.abs(clo-targetContrib)<Math.abs(chi-targetContrib)?lo:hi;
  for(let i=0;i<40;i++){ const mid=(lo+hi)/2, cm=contribEster(date,es,mid);
    if((cm-targetContrib)*(clo-targetContrib)<=0){hi=mid;chi=cm;} else {lo=mid;clo=cm;} }
  return (lo+hi)/2;
}

function recomputeCorrection(){ if(typeof bumpRev==="function") bumpRev(); // re-derive CORR from ALL logged draws (accumulate, never replace)
  CORR={dTE:0,dTU:0,dTP:0,S:1,provisional:false,nDraws:0,informs:{TE:0,TU:0,TP:0}};
  const draws=(DATA.blood||[]).filter(b=>b.tt>0).sort((a,b)=>ms(a.t)-ms(b.t));
  CORR.nDraws=draws.length;
  if(draws.length===0){ saveCorr(); return; }
  /* GUARD added 5.11.2026, when archiving was opened up to injections. If every injection covering a draw
     has been archived or deleted, the model predicts 0 nmol/L at that moment, and the scale step below
     divides the measured value by zero: CORR.S becomes Infinity and every number in the app turns to NaN.
     There is nothing to correct against in that state, so the correction is left neutral and flagged
     provisional until an injection comes back. */
  if(!draws.some(b=>Tat(ms(b.t))>0.01)){ CORR.provisional=true; saveCorr(); return; }
  if(draws.length===1){                               // provisional: share by local sensitivity, scale takes overflow, closes exactly
    const a=attribute(draws[0]), date=draws[0].t, pred0=Tat(ms(date));
    for(const es of ["TE","TU","TP"]){ if(Math.abs(a.alloc[es])>0.002 && Math.abs(a.cap[es])>0.002 && a.plasma[es]>0.01){
      const target=(a.plasma[es]+a.alloc[es])*pred0, hl=solveHalf(date,es,target);
      CORR["d"+es]=hl/HLVAL[es]-1; CORR.informs[es]=1; } }
    const predNow=Tat(ms(date)); CORR.S *= draws[0].tt/predNow;    // scale closes the remainder exactly
    CORR.provisional=true; saveCorr(); return;
  }
  // >= 2 draws: joint bounded fit. Ratios pin half-lives, level pins scale (scale cancels in a ratio).
  const clampD=es=>[HLLO[es]/HLVAL[es]-1, HLHI[es]/HLVAL[es]-1];
  const cost=()=>{ let j=0; for(const b of draws){ const p=Tat(ms(b.t)); j+=Math.pow((p-b.tt)/(b.tt*0.07),2); } // 0.07 = assay error
    j+=Math.pow(CORR.dTE/SIGMA0.TE,2)+Math.pow(CORR.dTU/SIGMA0.TU,2)+Math.pow(CORR.dTP/SIGMA0.TP,2); return j; };
  const golden=(set,lo,hi)=>{ const gr=0.618; let a=lo,b=hi; for(let i=0;i<28;i++){ const c=b-gr*(b-a),d=a+gr*(b-a);
      set(c); const fc=cost(); set(d); const fd=cost(); if(fc<fd)b=d; else a=c; } set((a+b)/2); };
  for(let sweep=0; sweep<24; sweep++){
    for(const es of ["TE","TU","TP"]){ const [cl,ch]=clampD(es); golden(v=>{CORR["d"+es]=v;}, cl, ch); }
    golden(v=>{CORR.S=v;}, 0.3, 3.0);
  }
  for(const es of ["TE","TU","TP"]) CORR.informs[es]=draws.length-1;  // ratios across N draws inform half-lives
  CORR.provisional=false; saveCorr();
}
function drawReview(draw){ const a=attribute(draw); const g=Math.abs(a.gap);
  if(g<0.30) return null;
  return {gap:a.gap, dom:a.dom, domShare:Math.round(a.plasma[a.dom]*100), mixed:a.plasma[a.dom]<0.5, scale:a.scalePortion}; }

function stackedChart(nowT, back, fwd, yMax){ // per-ester contribution to total T
  const W=680,H=180,padL=42,padR=8,padT=14,padB=30, short=back<=12;
  const tMin=nowT-back*3600000, tMax=nowT+fwd*3600000, N=90;
  const X=t=>padL+(t-tMin)/(tMax-tMin)*(W-padL-padR), Y=v=>padT+(1-v/yMax)*(H-padT-padB);
  const pts=[]; for(let i=0;i<=N;i++){ const t=tMin+(tMax-tMin)*i/N; pts.push({t,c:Tcomp(t)}); }
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">`;
  s+=`<rect x="${X(nowT).toFixed(1)}" y="${padT}" width="${(W-padR-X(nowT)).toFixed(1)}" height="${H-padT-padB}" fill="rgba(95,122,134,0.08)"/>`;
  let base=pts.map(()=>0);
  for(const es of ["TU","TE","TP"]){                       // stack: undecanoate base, enanthate, propionate on top
    const top=pts.map((p,i)=>base[i]+p.c[es]); let d="";
    pts.forEach((p,i)=>{ d+=(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(top[i]).toFixed(1)+" "; });
    for(let i=pts.length-1;i>=0;i--) d+="L"+X(pts[i].t).toFixed(1)+" "+Y(base[i]).toFixed(1)+" ";
    s+=`<path d="${d}Z" fill="${ESTCOL[es]}" opacity="0.72"/>`; base=top;
  }

  s+=`<path d="${tl}" fill="none" stroke="#EAF4F8" stroke-width="1" opacity="0.55"/>`;
  const nx=X(nowT).toFixed(1);
  s+=`<line x1="${nx}" y1="${padT}" x2="${nx}" y2="${H-padB}" stroke="#4DB8D9" opacity="0.85"/><text x="${nx}" y="${padT+9}" fill="#4DB8D9" font-family="${MONO}" font-size="9" text-anchor="middle">now</text>`;
  for(const v of [0,yMax/2,yMax]){ const y=Y(v).toFixed(1); s+=`<text x="${padL-4}" y="${(+y+3).toFixed(1)}" fill="#5F7A86" font-family="${MONO}" font-size="9" text-anchor="end">${Math.round(v)}</text>`; }

  return s;
}

function turningPoints(fn,t0,t1,minProm){   // local peaks and lows of the curve, ignoring anything flatter than minProm pmol

  for(let i=1;i<n;i++){
    const peak=v[i]>=v[i-1]&&v[i]>=v[i+1], low=v[i]<=v[i-1]&&v[i]<=v[i+1];
    if(!peak&&!low) continue;
    let l=i, r=i;                                    // how far the curve moves either side before turning back

    while(r<n && (peak? v[r+1]<=v[r] : v[r+1]>=v[r])) r++;

  for(let i=0;i<=60;i++){ const tt=Math.max(tMin,E2BLACKOUT)+(tMax-Math.max(tMin,E2BLACKOUT))*i/60; eMax=Math.max(eMax,hisHi(tt),modC(tt)); eMin=Math.min(eMin,hisLo(tt),modC(tt)); }
  eMax=Math.ceil(eMax*1.04/10)*10; eMin=Math.max(0,Math.floor(eMin*0.95/10)*10);
  let aiMax=0.3; for(let i=0;i<=40;i++){ aiMax=Math.max(aiMax,Lat(tMin+(tMax-tMin)*i/40)); }
  const stY={crashed:Math.max(eMin+4,cut.crbe-8), below:(cut.crbe+cut.besw)/2, sweet_spot:(cut.besw+cut.hiov)/2, high_end:(cut.besw+cut.hiov)/2, over:Math.min(eMax-4,cut.hiov+8)};
  const dropped=hp.vr.droppedUnsure.concat(DATA.reports.filter(r=>r.cleared));   // faint dots: unsure logs that do not fit, and logs you set aside by hand
  const feelMarks=DATA.reports.filter(r=>r.state).map(r=>({t:ms(r.t),y:stY[r.state],color:dropped.includes(r)?"#5F7A86":"#EAF4F8"}));   // DATA.archived is never drawn: archived logs are noise on the chart
  let center,lo,hi,centerColor,bandColor,overlay=null;
  if(e2mode==="objective"){ center=modC; lo=bLo(M.Imax,M.L50,M.aiHL); hi=bHi(M.Imax,M.L50,M.aiHL); centerColor=COBJ; bandColor="rgba(91,79,168,0.22)"; }
  else { center=hisC; lo=hisLo; hi=hisHi; centerColor="#4DB8D9"; bandColor="rgba(77,184,217,0.15)";
    if(e2mode==="both"){ overlay={fn:modC,color:COBJ}; bandColor="transparent"; } }
  const dnow=new Date(); dnow.setMinutes(dnow.getMinutes()-dnow.getTimezoneOffset()); const nowISO=dnow.toISOString().slice(0,16);
  let previewFn=null, previewRead="";
  if(previewDose>0){
    previewFn = tt=>{ const T=Tat(tt); return prodE(T,tt)*aiBlock(tt, hp.aiHL, [{t:nowISO,mg:previewDose,kind:previewKind}], hp.Imax, hp.L50); };
    const span=previewKind==="exemestane"?10*24:5*24;
    // Report where the dose bites hardest, which is where it pulls you furthest BELOW the no-dose line.
    // Reporting the plain low point was misleading while estradiol is climbing: every dose showed the same number, today's level.
    let rel=-1, gap=0, bestT=t, bestE=0; for(let h=0;h<=span;h+=1){ const w2=t+h*3600000, withD=previewFn(w2), without=E2at(w2,{Imax:hp.Imax,L50:hp.L50,aiHL:hp.aiHL});
      const r=without>0?(without-withD)/without:0;   // the strongest block, as a share. Using the plain pmol gap put the peak at the end of the window whenever estradiol was climbing
      if(r>rel){ rel=r; gap=without-withD; bestT=w2; bestE=withD; } }
    const inH=Math.round((bestT-t)/3600000), inTxt=inH>36?`${(inH/24).toFixed(1)} days`:`${inH} h`;
    previewRead=`${previewDose} mg ${previewKind} bites hardest in ${inTxt}: about ${r0(gap)} pmol below where you would otherwise be, putting you at ${r0(bestE)} pmol, ${SNAME(stateOf(bestE,cutoffs(hp.anchor,hp.ratio)))}. Then it eases off${previewKind==="exemestane"?" as you rebuild the enzyme":" as it clears"}.`;
  }
  const crossings=v.marks?stateCrossings(center,chartLines,chartNames,Math.max(tMin,E2BLACKOUT),tMax):[];
  const turns=turningPoints(center,Math.max(tMin,E2BLACKOUT),tMax,Math.max(2,(eMax-eMin)*0.03));   // ignore turns flatter than 3% of the view, so flat stretches are not labelled   // only Day and Week write crossing labels; over 8 days or a month they covered the graph
  let tTop=40; for(let i=0;i<=80;i++){ const tt=tMin+(tMax-tMin)*i/80; tTop=Math.max(tTop,Tat(tt,eSlow),Tat(tt,eFast)); } tTop=Math.ceil(tTop*1.08/10)*10;
  const line2 = chartShow==="et"
    ? {fn:tt=>Tat(tt),max:tTop,color:"#EAF4F8",label:`testosterone (top of chart ${tTop} nmol/L)`}
    : {fn:tt=>e2mode==="objective"?Lat(tt):aiLoad(tt,hp.aiHL),max:aiMax*1.1,color:"#EAF4F8",label:"",blackoutBefore:E2BLACKOUT};
  const tcfgE={nowT:t,back:v.back,fwd:v.fwd,yMin:0,yMax:tTop,center:tt=>Tat(tt),lo:tt=>Math.min(Tat(tt,eFast),Tat(tt,eSlow)),hi:tt=>Math.max(Tat(tt,eFast),Tat(tt,eSlow)),
    centerColor:"#4DB8D9",bandColor:"rgba(77,184,217,0.15)",marks:DATA.inj.map(x=>({t:ms(x.t),kind:"inj"})),
    hlines:[{y:30,color:"#5D7488",label:"top of normal 30"}]};
  const e2cfg={nowT:t,back:v.back,fwd:v.fwd,yMin:eMin,yMax:eMax,center,lo,hi,centerColor,bandColor,overlay,preview:previewFn?{fn:previewFn,color:"#F0C040"}:null,points:feelMarks,hideY:true,blackoutBefore:E2BLACKOUT,marks,crossings,turns,edgeLabels:true,
    line2,
    shades:[],
    zones:useObj ? [] : [   // every state is a band you can see the width of, not a line
      {y0:eMin,y1:cut.crbe,fill:"rgba(217,46,58,0.08)",color:"#9FBAC6",label:"CRASHED"},
      {y0:cut.crbe,y1:cut.besw,fill:"rgba(93,116,136,0.10)",color:"#9FBAC6",label:"LOW"},
      {y0:cut.besw,y1:cut.hiov,fill:"rgba(42,138,143,0.30)",color:"#4DB8D9",label:"GOOD",big:true},
      {y0:cut.hiov,y1:eMax,fill:"rgba(217,46,58,0.08)",color:"#9FBAC6",label:"ABOVE CEILING"}],
    hlines:useObj
      ? [{y:NORM.lo,color:"#5D7488",label:"normal low "+NORM.lo},{y:NORM.hi,color:"#5D7488",label:"normal high "+NORM.hi}]
      : [{y:cut.crbe,color:"#5D7488",label:r0(cut.crbe)},{y:cut.besw,color:"#5D7488",label:r0(cut.besw)},{y:cut.hiov,color:"#D92E3A",label:"ceiling "+r0(cut.hiov)}]};
  $("#v-estrogen").innerHTML = trendCard + `
    <div class="two">
      <div class="card"><div class="row"><h2>Objective</h2>${iBtn('model')}</div>
        <div class="big">${r0(tr.model.e)}<span class="unit"> pmol/L</span></div>

      <div class="card"><div class="row"><h2>Your estimate</h2>${iBtn('his')}</div>
        <div class="big">${r0(tr.his.e)}<span class="unit"> pmol/L</span></div>

</div>
    </div>

      <div style="margin:0 -12px">${svgChart(chartShow==="t"?tcfgE:e2cfg)}</div>

      ${chartShow==="t"?"":lineToggle()}

function renderTest(){
  const t=Date.now(), T=Tat(t), v=VIEWS[trendsView], H=effHalf();
  const shb=shbgAt(t);
  const freePct=freeT(T,shb), freeAbs=T*freePct/100;
  const freeCeil=30*freeT(30,shb)/100, freeMult=freeAbs/freeCeil; // free at the top of the normal total range, at your SHBG
  const cc=Tcomp(t), pTE=Math.round(100*cc.TE/cc.total), pTU=Math.round(100*cc.TU/cc.total), pTP=Math.round(100*cc.TP/cc.total);
  INFO.T={t:"Total testosterone",body:`<p>${r0(T)} nmol/L, sum of all logged injections under absorption-limited release. Lab reference 10 to 30. ${(T/30).toFixed(1)}x the top of that range.</p>
    <p class="k">Half-lives in force: enanthate ${r1(H.TE)} d, undecanoate ${r1(H.TU)} d, propionate ${r0(H.TP*24)} h. Scale x${CORR.S.toFixed(2)}. ${CORR.nDraws?`From ${CORR.nDraws} blood draw${CORR.nDraws>1?'s':''}${CORR.provisional?', provisional':''}.`:'No blood draws yet; literature values.'}</p>`};
  INFO.free={t:"Free testosterone",body:`<p>${r1(freeAbs)} nmol/L, ${freeMult.toFixed(1)}x the top of normal. CALCULATED from total and SHBG ${r1(shb)} by Vermeulen, not a second measurement.</p>
    <p class="k">The multiple is against the free T you would have at the top of the normal total range (30 nmol/L) at your own SHBG, about ${r1(freeCeil)} nmol/L. It runs a touch above the total multiple because your low SHBG gives you more free per unit as T rises.</p>
    <p class="k">SHBG ${r1(shb)} is ${(DATA.factors||[]).some(x=>x.shbg!=null)||(DATA.blood||[]).some(x=>x.shbg!=null)?"your latest logged value":"the default; log a measured SHBG under Body and labs and it feeds here live"}. At SHBG 20 the fraction would be ${r1(freeT(T,20))}%.</p>`};
  INFO.tchart={t:"Testosterone trajectory",body:`<p>Total T in nmol/L, band from the ester half-life ranges (TE 3.4 to 4.2 d, TU 29 to 34 d, TP 19 to 25 h), narrow over history, widening forward. History is drawn the whole way; the pre-12.10 blackout is estradiol only.</p>
    <p class="k">Backward is history, forward assumes no further injections or doses. 10 to 30 is your normal range; the yellow line at 35 is where testosterone starts driving estradiol again.</p>
    <p class="k">Read where you will be from the curve and adjust. You stop enanthate about 40 days out and propionate about 4 days out, so by a draw date you sit below threshold on undecanoate.</p>`};
  INFO.lookup={t:"Level on a date",body:`<p>The model's total testosterone for any date you pick, past or future, read against your lab range 10 to 30. For a future date it assumes no injections beyond the last you logged.</p>
    <p class="k">Use it when a draw is scheduled: enter the date and see where you will sit, and how much of it is undecanoate.</p>`};
  INFO.breakdown={t:"What makes up the level",body:`<p>Your total T right now, split by ester: enanthate ${pTE}%, undecanoate ${pTU}%, propionate ${pTP}%. A snapshot of this moment, not over time.</p>
    <p class="k">Undecanoate is the slow base. Enanthate is the weekly layer on top. Propionate is the short spike that clears in a couple of days.</p>
    <p class="k">This is why timing a draw works: stop enanthate and propionate and the pie collapses to almost all undecanoate, which is what you read in range.</p>`};
  // chart
  const eFast={TE:3.4,TU:29,TP:19/24}, eSlow={TE:4.2,TU:34,TP:25/24};
  const marks=DATA.inj.map(x=>({t:ms(x.t),kind:"inj"})).concat(DATA.ai.map(x=>({t:ms(x.t),kind:"ai"})));
  const tMin=t-v.back*3600000, tMax=t+v.fwd*3600000; let tMax2=35;
  for(let i=0;i<=60;i++){ tMax2=Math.max(tMax2,Tat(tMin+(tMax-tMin)*i/60,eSlow)); }
  tMax2=Math.ceil(tMax2*1.04/20)*20;
  const tcfg={nowT:t,back:v.back,fwd:v.fwd,yMin:0,yMax:tMax2,center:tt=>Tat(tt),lo:tt=>Tat(tt,eFast),hi:tt=>Tat(tt,eSlow),marks,
    shades:[{y0:10,y1:30,color:"rgba(42,138,143,0.14)"}],
    hlines:[{y:30,color:"#5D7488",label:"30 top of range"},{y:10,color:"#5D7488",label:"10 bottom"},{y:35,color:"#F0C040",label:"35 saturation"}]};
  // planner
  let reviewCard="";
  (DATA.blood||[]).forEach((b,i)=>{ if(b.review && !b.reviewDismissed){ const r=b.review, name=({TE:"enanthate",TU:"undecanoate",TP:"propionate"})[r.dom];
    const pct=Math.round(Math.abs(r.gap)*100), dir=r.gap<0?'below':'above';
    const body = r.mixed
      ? `The ${fmtDay(b.t)} result was ${pct}% ${dir} prediction. No single ester dominated the sample, so the gap went mostly to scale, clearance x bioavailability, now x${CORR.S.toFixed(2)}.`

    reviewCard += `<div class="card alert"><div class="row"><h2>${r.mixed?'Review scale':'Review '+name+' half-life'}</h2><button class="i" onclick="dismissReview(${i})">x</button></div>
      <div class="sub">${body}</div></div>`; } });
  $("#v-test").innerHTML= reviewCard + `

      <div style="margin:0 -12px">${svgChart(tcfg)}</div>
      ${viewToggle('renderTest')}

function updateLookup(){

  s+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="rgba(77,184,217,0.16)"/></svg>`;
  return s;
}

const ESTER_NAME={TE:"enanthate",TU:"undecanoate",TP:"propionate"};
function entryKind(x){   // which list an entry belongs to; archived entries carry it on themselves

  if(kind==="blood") return `blood: T ${x.tt} nmol/L${x.shbg?`, SHBG ${x.shbg}`:""}${x.ft?`, free ${x.ft}`:""}`;
  if(kind==="factors"){ const p=[]; if(x.weight!=null)p.push(`${x.weight} kg`); if(x.bodyfat!=null)p.push(`${x.bodyfat}% fat`); if(x.shbg!=null)p.push(`SHBG ${x.shbg}`); return `body: ${p.join(", ")}`; }

function entryRows(src,archived){

/* Press a feeling entry to see what the model said at the moment you saved it (added 5.11.2026 at Jonas's request).

function archiveEntry(id){

function showWords(){

    const mod = r.seeded ? SNAME(stateOf(E2at(ms(r.t)),liveCut())) : (r.predictedState?SNAME(r.predictedState):"-");
    const his = r.ambiguous ? "ambiguous" : LNAME(r.state);
    return `<tr class="${r.conflict?'conflict':''}"><td class="mono" style="font-size:12px">${fmtDT(r.t)}</td><td>"${r.note}"</td><td class="mono" style="font-size:12px">${his}</td><td class="mono faint" style="font-size:12px">${mod}</td></tr>`;
  }).join("");
  const amb=DATA.reports.filter(r=>r.ambiguous).map(r=>`<div class="list-row"><span>"${r.note}"</span><span class="faint mono" style="font-size:12px">${fmtDT(r.t)}</span></div>`).join("")||`<div class="sub">None.</div>`;
  $("#morepane").innerHTML=`<div class="card"><h2>Vocabulary index</h2>
    <p class="sub">Your exact words, the state you chose, and the state the model computed, side by side. The model never labels your words.</p>
    <table><thead><tr><th>When</th><th>Your words</th><th>You</th><th>Model</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="notice warn">The first ten reports use default times, not times you recorded: 16:00, or the 12.10 dose minus 1 h and plus 6 h. Those times set the anchor, and the anchor sets every state boundary, so the seed reports carry weaker footing than anything you log from now with its own recorded time.</div>
    <div class="notice warn">Carried conflicts: 13.10 you read Above ceiling, the model puts you in window; 17.10 you read High at a value 2 pmol below your 16.10 Sweet spot, below the model's resolution. Kept, not resolved.</div>
    <h3>Ambiguous list</h3>${amb}</div>`;
  scrollPane();
}
function showValidation(){
  const prosp=DATA.reports.filter(r=>!r.seeded && r.state && r.predictedState);
  let body;
  if(!prosp.length){ body=`<p class="sub">No prospective entries yet. Every report you log from now records the model's prediction first, then your state, then the gap. Seeded history is retrospective and not scored here.</p>`; }
  else {
    const rows=prosp.map(r=>{
      const d=Math.abs(STATE.findIndex(s=>s.k===r.state)-STATE.findIndex(s=>s.k===r.predictedState));
      return `<tr><td class="mono" style="font-size:12px">${fmtDT(r.t)}</td><td class="mono" style="font-size:12px">${SNAME(r.predictedState)}</td><td class="mono" style="font-size:12px">${LNAME(r.state)}</td><td class="n">${d===0?"match":d+" off"}</td></tr>`;
    }).join("");
    const hits=prosp.filter(r=>r.state===r.predictedState).length;
    body=`<p class="sub">${hits} of ${prosp.length} exact matches.</p>
      <table><thead><tr><th>When</th><th>Predicted</th><th>You</th><th>Gap</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  $("#morepane").innerHTML=`<div class="card"><h2>Prospective validation</h2>${body}</div>`;
  scrollPane();
}
function showTerms(){
  const stTerms=STATE.map(s=>`<p><span class="state" style="font-size:13px">${s.name}</span><br><span class="sub">${s.desc}</span></p>`).join("");
  $("#morepane").innerHTML=`<div class="card"><h2>Terms</h2>
    ${stTerms}
    <div class="divider"></div>
    <p><span class="state" style="font-size:13px">Rising alert</span><br><span class="sub">The day you reach Above ceiling if you take nothing more.</span></p>
    <p><span class="state" style="font-size:13px">Falling alert</span><br><span class="sub">The day you reach Crashed on your current dosing. Only testosterone prevents a fall.</span></p>

    <p><span class="state" style="font-size:13px">Your estimate</span><br><span class="sub">The same estradiol number as Objective, in pmol/L, read against your own states instead of against other men.</span></p>

    <div class="divider"></div>
    <p><span class="state" style="font-size:13px">Your state lines</span><br><span class="sub">Fixed starting values in pmol: crashed 77, Good 105 to 132. Each moves only when a log lands on its wrong side, and only as far as that log. A log that agrees moves nothing.</span></p>
  </div>`;
  scrollPane();
}

    <p class="sub">Estrogen graph, all in pmol/L (testosterone is nmol/L on its own page).</p>
    <div class="list-row"><span>Blue line</span><span class="sub">your estimate, your logs folded in</span></div>
    <div class="list-row"><span>Violet line</span><span class="sub">objective, injections and doses only, no feelings</span></div>
    <div class="list-row"><span>Pale band around the line</span><span class="sub">how uncertain the model is, from the ester half-life and clearance ranges. Narrow over history, wider ahead</span></div>
    <div class="list-row"><span>Bright teal band, GOOD</span><span class="sub">your good range, from your low line up to your ceiling, drawn at its real width</span></div>
    <div class="list-row"><span>Faint grey band, LOW</span><span class="sub">below Good</span></div>
    <div class="list-row"><span>Faint red bands</span><span class="sub">CRASHED at the bottom, ABOVE CEILING at the top</span></div>
    <div class="list-row"><span>Dashed grey line with a number</span><span class="sub">a boundary between two states, labelled in pmol/L</span></div>
    <div class="list-row"><span>White dot on the line with a date and arrow</span><span class="sub">the moment the curve crosses a boundary, and which state it enters. The dot is the moment, so there is no vertical line any more</span></div>

    <div class="list-row"><span>pmol number at the very top and bottom</span><span class="sub">where the chart starts and stops. It does not start at zero, so a band can continue past the edge</span></div>
    <div class="list-row"><span>Dashed red line, ceiling</span><span class="sub">where you tip over into the zombie state</span></div>
    <div class="list-row"><span>Dotted white line</span><span class="sub">aromatase inhibitor on board, zero at the bottom, on its own scale. After exemestane it deepens for two to three days and then fades over days, because the enzyme has to be rebuilt</span></div>
    <div class="list-row"><span>Dashed amber line</span><span class="sub">a Try a dose preview. Nothing is logged</span></div>
    <div class="list-row"><span>White rings</span><span class="sub">your own logs, at the time and level they were made. Grey rings are logs set aside, kept but not counted</span></div>
    <div class="list-row"><span>Blue triangles along the bottom</span><span class="sub">injections</span></div>
    <div class="list-row"><span>Yellow dots along the bottom</span><span class="sub">aromatase inhibitor doses</span></div>
    <div class="list-row"><span>Blue NOW line</span><span class="sub">this moment. Everything right of it is a projection</span></div>
    <div class="list-row"><span>Shaded panel on the right</span><span class="sub">the future, assuming no further injections or doses</span></div>

    <div class="list-row"><span>Dark panel on the left</span><span class="sub">before 12.10.2026, when no aromatase inhibitor was logged, so no estradiol is drawn</span></div>
    <div class="notice">Views: Day is 12 h back and 12 h ahead, marked every 3 h. Week is 12 h back and 7 days ahead. 8 days is 4 days each way. Month is 2 days back and a month ahead.</div></div>`;
  scrollPane();
}
/* Body fat, its own card on the Data tab (added 5.11.2026 at Jonas's request: he wanted it pressable like the other
   cards, saved through the same confirm box, and stored so it is remembered). The maths is unchanged: body fat shifts
   estradiol production by a fixed literature coefficient, +2% per 10 points against an 18.6% reference (Lakshman 2010),
   and it is dated so every past log is recalculated at the body fat that applied on its own day. */
function showBodyFat(){
  INFO.bodyfat={t:"Body fat",body:`<p>Fat tissue is where most of the testosterone-to-estradiol conversion happens, so your body fat shifts the whole estradiol curve.</p>
    <p class="k">The size of the shift is a fixed figure from the literature, not learned: +2% estradiol per 10 points of body fat, measured against a reference of 18.6% (Lakshman 2010, young men on weekly testosterone, average body fat 18.6%). At 18% the curve runs at x0.999; moving from 18% to 12% lowers estradiol by about 1.2%.</p>
    <p class="k">It is fixed rather than learned because the study found the effect small and not clearly different from zero, and because every extra thing that learns blurs what the rest of the learning can see.</p>
    <p class="k">Values are dated. Between two of them the app draws a straight line and every past log is recalculated at the body fat that applied on its own day, so changing it now never rewrites what your old logs meant.</p>`};
  const cur=bodyfatAt(Date.now()), list=(DATA.factors||[]).filter(x=>x.bodyfat!=null).sort((a,b)=>ms(b.t)-ms(a.t));
  $("#morepane").innerHTML=`<div class="card"><div class="row"><h2>Body fat</h2>${iBtn('bodyfat')}</div>
    <p class="sub">${cur==null?"Not set. Until you set it, the curve runs unchanged.":`Now ${r1(cur)}%. Estradiol curve x ${fatFactor(Date.now()).toFixed(3)}.`}</p>
    <div class="two"><label class="fl"><div class="field-lab">Body fat, %</div><input type="text" id="bfval" inputmode="decimal" placeholder="${cur==null?"18":r1(cur)}"></label>
      <label class="fl"><div class="field-lab">Weight, kg (optional)</div><input type="text" id="bfw" inputmode="decimal"></label></div>
    ${dtField('bfd','bft',todayISO(),nowHM())}
    <button class="act" id="saveBF">Save</button>
    ${list.length?`<h3>Earlier values</h3>`+list.map(x=>`<div class="list-row"><span>${fmtDay(x.t)}</span><span class="mono">${x.bodyfat}%${x.weight!=null?", "+x.weight+" kg":""}</span></div>`).join(""):""}
    <div class="notice">Each value is kept with its date. Between two values the app draws a straight line, so a log made on the way from 18 to 15% is calculated at the body fat you actually had that day. Nothing is overwritten; set a new value whenever it changes.</div></div>`;
  $("#saveBF").onclick=()=>{ const bf=num("#bfval"), w=num("#bfw"), t=readDT('bfd','bft');
    if(!bf){toast("Enter body fat %");return;} if(!inR(bf,3,50,"Body fat %"))return;
    if(w&&!inR(w,40,250,"Weight kg"))return;
    if(!t){toast("Time must be 24h");return;} if(future(t))return;
    const f={t,bodyfat:bf}; if(w)f.weight=w;
    DATA.factors.push(f); DATA.factors.sort((a,b)=>ms(a.t)-ms(b.t)); save();
    confirmSave(f.id,"Your body fat",[["Body fat",`${bf}%`],["Date",fmtDay(t)],["Time",t.slice(11)]]);
    renderData(); showBodyFat(); renderEstrogen(); };
  scrollPane();
}
function showScale(){
  const hp=hisParams(), c=cutoffs(hp.anchor,hp.ratio);
  const rows=[["Above ceiling",`above ${r0(c.hiov)}`],["Good",`${r0(c.besw)} to ${r0(c.hiov)}`],["Low",`${r0(c.crbe)} to ${r0(c.besw)}`],["Crashed",`under ${r0(c.crbe)}`]];
  $("#morepane").innerHTML=`<div class="card"><h2>Your estrogen scale now</h2>
    <p class="sub">Each state in pmol/L. The lines start at 77 / 105 / 132 and move only where one of your logs landed on the wrong side of one. Middle of Good right now ${r0(hp.anchor)}. Input weight ${r0(hp.w*100)}%.</p>
    ${rows.map(r=>`<div class="list-row"><span class="state" style="font-size:13px">${r[0]}</span><span class="mono">${r[1]} pmol/L</span></div>`).join("")}
    <h3>How the anchor has moved</h3>
    <div class="mono" style="font-size:16px;color:var(--accent);letter-spacing:.04em;margin:4px 0">${anchorSeries(4).join("  &rarr;  ")}</div>
    <p class="sub faint">Snapshots every 10 reports, the last point live. The whole ladder above slides with it.</p>
    <div class="notice">These numbers change over time. A testosterone draw nudges them a little through aromatisation; your sweet-spot and other reports move the anchor they hang from.</div></div>`;
  scrollPane();
}
function showCurve(){
  const hp=hisParams(), vr=hp.vr, bf=bodyfatAt(Date.now()), R=hp.ratio;
  const row=(l,v)=>`<div class="list-row"><span>${l}</span><span class="mono">${v}</span></div>`;
  $("#morepane").innerHTML=`<div class="card"><h2>What the app learns</h2>
    <p class="sub">Your scale and two anastrozole values learn from your logs. Everything else is fixed from research and corrected only by blood tests.</p>
    ${row("Middle of Good", `${r0(hp.anchor)} pmol/L, ${r0(hp.w*100)}% from your logs`)}
    ${row("Crashed", `under ${r0(R.crbe*hp.anchor)} pmol`)}
    ${row("Low", `${r0(R.crbe*hp.anchor)} to ${r0(R.besw*hp.anchor)} pmol`)}
    ${row("Good", `${r0(R.besw*hp.anchor)} to ${r0(R.hiov*hp.anchor)} pmol`)}
    ${row("Above ceiling", `over ${r0(R.hiov*hp.anchor)} pmol`)}
    ${row("Logs setting your lines", `good ${hp.inWin.sweet}, low ${hp.inWin.low}, crashed ${hp.inWin.crashed}, above ceiling ${hp.inWin.over} (all of them)`)}
    ${row("Anastrozole strength", `Imax ${r1(hp.Imax)}, L50 ${r1(hp.L50)}`)}
    ${row("Anastrozole clearance", `${r1(hp.aiHL)} h`)}
    ${row("Strength and clearance from your logs", `${r0(hp.wD*100)}%`)}
    ${row("Logs set aside", `${vr.droppedUnsure.length} unsure, ${vr.pendingUnsure.length} waiting`)}
    ${row("Body fat now", bf==null?"not logged":`${r1(bf)}%, curve x ${fatFactor(Date.now()).toFixed(3)}`)}
    <div class="notice">Lines start at 77 / 105 / 132 pmol. A line goes where the fewest logs disagree with it; a log sitting exactly on a line disagrees with nothing, and a log that agrees moves nothing however many there are. A line moves only when moving disagrees with at least 2 fewer logs than leaving it put, so no single log can shift a line. Logs archived before 4.11.2026 are never read. Anastrozole strength and clearance are locked at the research values.</div></div>`;
  scrollPane();
}
function showChecks(){
  const res=runChecks();
  const rows=res.map(r=>{
    const mark=r.pass===true?"pass":r.pass===false?"FAIL":"pending";
    const col=r.pass===true?"var(--accent)":r.pass===false?"var(--red)":"var(--yellow)";
    return `<div class="list-row"><span>${r.name}<br><span class="faint" style="font-size:12px">${r.detail}</span></span><span class="mono" style="font-size:11px;letter-spacing:.1em;color:${col}">${mark}</span></div>`;
  }).join("");
  const fails=res.filter(r=>r.pass===false).length;
  $("#morepane").innerHTML=`<div class="card"><h2>Build assertions</h2>
    <p class="sub">${fails?`${fails} failing.`:"All hard checks pass."} Run on every load. A unit error reaching the screen means a missing check, so these run before anything is trusted.</p>
    ${rows}</div>`;
  scrollPane();
}
function parseImport(txt){   // checks an export before anything is replaced
  let d; try{ d=JSON.parse(txt); }catch(e){ return {err:"That is not valid export text."}; }
  if(!d||typeof d!=="object"||!Array.isArray(d.inj)||!Array.isArray(d.ai)||!Array.isArray(d.reports)) return {err:"That text is not an export from this app."};
  const bad=[...d.inj,...d.ai,...d.reports].some(x=>!x||typeof x.t!=="string"||isNaN(ms(x.t)));
  if(bad) return {err:"Some entries have no valid time. Nothing was changed."};
  return {d:normalize(d)}; }
function showImport(){
  $("#morepane").innerHTML=`<div class="card"><h2>Import</h2>
    <p class="sub">Restores the app from an export. Everything now in the app is replaced, and a copy of it is kept so the import can be undone.</p>
    <input type="file" id="impfile" accept=".json,.txt,application/json,text/plain" style="margin:8px 0">
    <textarea id="imptxt" placeholder="or paste the export text here" style="height:140px"></textarea>
    <button class="act primary sm" id="impgo" style="margin-top:12px">Import</button>
    ${localStorage.getItem("e2model_before_import")?`<button class="act sm" id="impundo" style="margin-top:12px">Undo last import</button>`:""}</div>`;
  $("#impfile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ $("#imptxt").value=String(rd.result||""); }; rd.readAsText(f); };
  $("#impgo").onclick=()=>{ const r=parseImport($("#imptxt").value.trim()); if(r.err){ toast(r.err); return; }
    const n=r.d.reports.length+r.d.inj.length+r.d.ai.length;
    if(!confirm(`Replace everything in the app with this export (${r.d.reports.length} feelings, ${r.d.inj.length} injections, ${r.d.ai.length} anastrozole doses)?`)) return;
    try{ localStorage.setItem("e2model_before_import",JSON.stringify(DATA)); }catch(e){}
    DATA=r.d; if(DATA.blood.length) recomputeCorrection(); save(); toast(`Imported ${n} entries`); renderData(); };
  const u=$("#impundo"); if(u) u.onclick=()=>{ const r=parseImport(localStorage.getItem("e2model_before_import")||""); if(r.err){ toast("Nothing to undo"); return; }
    if(!confirm("Put back the data from before the last import?")) return; DATA=r.d; if(DATA.blood.length) recomputeCorrection(); save(); localStorage.removeItem("e2model_before_import"); toast("Import undone"); renderData(); };
  scrollPane(); }
function scrollPane(){ setTimeout(()=>$("#morepane").scrollIntoView({behavior:"smooth",block:"start"}),40); }

function doExport(){
  const json=JSON.stringify(DATA,null,2);
  const share=async()=>{
    try{ if(navigator.share){ await navigator.share({title:"E2 Model data",text:json}); return; } }catch(e){}
    try{ await navigator.clipboard.writeText(json); toast("Copied to clipboard"); }
    catch(e){ openInfoRaw("Export","Select and copy:<br><br><textarea style='width:100%;height:200px'>"+json.replace(/</g,"&lt;")+"</textarea>"); }
  };
  share();
}

/* ============================ NAV / UTIL ============================ */
let curView="estrogen";
const TITLES={estrogen:"Estrogen",test:"Testosterone",log:"Log",entries:"Entries",data:"Data"};
function show(v){
  curView=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#htitle").textContent=TITLES[v];
  if(v==="estrogen")renderEstrogen(); if(v==="test")renderTest(); if(v==="log")renderLog(); if(v==="entries")renderEntries(); if(v==="data")renderData();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
let tT;
function toast(m){ if(Date.now()-saveFailAt<500) m="Save blocked, export a backup"; const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tT); tT=setTimeout(()=>el.classList.remove("on"),1600); }

$("#hdate").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}).toUpperCase();
setShbgFromBlood();
if(DATA.blood&&DATA.blood.length) recomputeCorrection();
if(!DATA.anchorLog||!DATA.anchorLog.length){ snapshotAnchor(true); save(); }
(function(){ const fails=runChecks().filter(r=>r.pass===false);
  if(fails.length){ const b=document.createElement("div"); b.className="card alert"; b.style.margin="12px 16px 0";
    b.innerHTML=`<h2>Build check failed</h2><div class="sub">${fails.map(f=>f.name+": "+f.detail).join("<br>")}</div><div class="sub" style="margin-top:6px">See Data, Checks.</div>`;
    document.querySelector("main").prepend(b); } })();
show("estrogen");
setInterval(tickAutoFields,10000);
// durability: ask the browser not to evict, and recover from IndexedDB if localStorage was cleared
(async()=>{
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  idb=await idbOpen();
  const backup=await idbGet();
  if(backup&&backup.inj&&!loadedFromStore){                 // localStorage was empty but IndexedDB survived
    DATA=backup; normalize(DATA); setShbgFromBlood(); bumpRev();
    if(DATA.blood.length) recomputeCorrection();
    try{ localStorage.setItem("e2model",JSON.stringify(DATA)); }catch(e){}
    show(curView);
  }
  idbSet(DATA);                                             // mirror current state into IndexedDB
})();
